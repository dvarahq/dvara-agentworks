<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{console/layout :: head('Sessions')}"></head>
<body th:attr="hx-headers=${console.csrfHeaders()}">
<header th:replace="~{console/layout :: nav('sessions')}"></header>
<main id="main" class="container py-4">
    <h1 class="h3">Logical sessions</h1>
    <table class="table table-sm align-middle">
        <caption>Sessions, newest first</caption>
        <thead><tr><th>Session</th><th>Deployment</th><th>Updated</th></tr></thead>
        <tbody>
        <tr th:each="item : ${sessions.items()}">
            <td><a th:href="@{/console/sessions/{id}(id=${item.id()})}"><code th:text="${item.id()}">id</code></a></td>
            <td><a th:href="@{/console/deployments/{id}(id=${item.deploymentId()})}"><code th:text="${item.deploymentId()}">deployment</code></a></td>
            <td th:text="${item.updatedAt()}">time</td>
        </tr>
        <tr th:if="${#lists.isEmpty(sessions.items())}"><td colspan="3">No sessions.</td></tr>
        </tbody>
    </table>
    <a class="btn btn-sm btn-outline-secondary" th:if="${sessions.nextCursor() != null}"
       th:href="@{/console/sessions(cursor=${sessions.nextCursor()})}">Next page</a>
</main>
</body>
</html>
