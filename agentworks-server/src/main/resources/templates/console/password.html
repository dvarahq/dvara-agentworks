<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{console/layout :: head('Change password')}"></head>
<body th:attr="hx-headers=${console != null} ? ${console.csrfHeaders()} : null">
<main id="main" class="container py-5 console-narrow">
    <h1 class="h3 mb-3">Change your password</h1>
    <p class="text-body-secondary">Changing it signs out every other session. Use 12 to 128 characters.</p>
    <form method="post" action="/console/password" hx-post="/console/password" hx-target="#password-result" hx-disabled-elt="find button" class="vstack gap-3">
        <div>
            <label for="current-password" class="form-label">Current password</label>
            <input id="current-password" name="currentPassword" type="password" class="form-control"
                   autocomplete="current-password" required>
        </div>
        <div>
            <label for="new-password" class="form-label">New password</label>
            <input id="new-password" name="newPassword" type="password" class="form-control"
                   autocomplete="new-password" minlength="12" maxlength="128" required>
        </div>
        <button type="submit" class="btn btn-primary">Change password</button>
        <div id="password-result" aria-live="polite"></div>
    </form>
    <button type="button" class="btn btn-link px-0 mt-3" hx-post="/console/logout" hx-target="#password-result">Sign out</button>
</main>
</body>
</html>
