<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head th:replace="~{console/layout :: head('Environment')}"></head>
<body th:attr="hx-headers=${console.csrfHeaders()}"><header th:replace="~{console/layout :: nav('deployments')}"></header><main id="main" class="container py-4"><nav aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/console/deployments">Deployments</a></li><li class="breadcrumb-item active" th:text="${environment.name()}">Environment</li></ol></nav><h1 class="h3" th:text="${environment.name()}">Environment</h1><p th:text="${environment.description()} ?: 'No description.'">Description</p><p class="small">Policy version <strong th:text="${environment.policyVersion()}">1</strong> · digest <code th:text="${environment.policyDigest()}">digest</code></p>
<section><h2 class="h5">Promotion policy</h2><form th:if="${console.can('ENVIRONMENT_ADMIN')}" method="post" th:action="@{/console/environments/{id}/policy(id=${environment.id()})}"><input type="hidden" name="version" th:value="${environment.policyVersion()}"><label for="policy" class="form-label">Policy JSON</label><textarea id="policy" name="policy" class="form-control font-monospace" rows="12" required th:text="${policy}">{}</textarea><button class="btn btn-primary mt-2">Save a new policy version</button></form><pre th:if="${!console.can('ENVIRONMENT_ADMIN')}" class="small console-document" th:text="${policy}">{}</pre></section>
<section class="mt-4"><h2 class="h5">Deployments</h2><ul><li th:each="deployment : ${deployments.items()}"><a th:href="@{/console/deployments/{id}(id=${deployment.id()})}" th:text="${deployment.name()}">name</a></li><li th:if="${#lists.isEmpty(deployments.items())}">No deployments in this environment.</li></ul></section></main></body></html>
