<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="en"><head th:replace="~{console/layout :: head('Audit')}"></head><body th:attr="hx-headers=${console.csrfHeaders()}"><header th:replace="~{console/layout :: nav('audit')}"></header><main id="main" class="container py-4"><h1 class="h3">Administrative audit</h1><p class="text-body-secondary">Immutable, workspace-scoped and redacted control-plane decisions.</p>
<form method="get" action="/console/audit" class="row g-2 mb-3"><div class="col-md-3"><label for="event-type" class="form-label">Event type</label><input id="event-type" name="eventType" class="form-control" th:value="${eventType}" placeholder="RELEASE_CREATED"></div><div class="col-md-2"><label for="outcome" class="form-label">Outcome</label><input id="outcome" name="outcome" class="form-control" th:value="${outcome}" placeholder="SUCCESS"></div><div class="col-md-2"><label for="target-type" class="form-label">Target type</label><input id="target-type" name="targetType" class="form-control" th:value="${targetType}" placeholder="RELEASE"></div><div class="col-md-3"><label for="target-id" class="form-label">Target id</label><input id="target-id" name="targetId" class="form-control" th:value="${targetId}"></div><div class="col-md-2 align-self-end"><button class="btn btn-outline-primary w-100">Filter</button></div></form>
<div class="table-responsive"><table class="table table-sm"><caption>Newest matching events</caption><thead><tr><th>Time</th><th>Event</th><th>Outcome</th><th>Target</th><th>Actor</th><th>Integrity</th></tr></thead><tbody><tr th:each="event : ${audit.items()}"><td th:text="${event.occurredAt()}">time</td><td th:text="${event.eventType()}">event</td><td th:text="${event.outcome()}">outcome</td><td><span th:text="${event.targetType()} ?: '—'">type</span><br><code th:text="${event.targetId()} ?: '—'">id</code></td><td><code th:text="${event.actorId()} ?: 'system'">actor</code></td><td><code class="small" th:text="${event.integrityDigest()}">digest</code></td></tr><tr th:if="${#lists.isEmpty(audit.items())}"><td colspan="6">No matching audit events.</td></tr></tbody></table></div><a class="btn btn-sm btn-outline-secondary" th:if="${audit.nextCursor() != null}" th:href="@{/console/audit(eventType=${eventType},outcome=${outcome},targetType=${targetType},targetId=${targetId},cursor=${audit.nextCursor()})}">Next page</a></main></body></html>
