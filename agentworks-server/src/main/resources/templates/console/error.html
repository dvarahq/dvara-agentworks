<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{console/layout :: head('Error')}"></head>
<body th:attr="hx-headers=${console != null} ? ${console.csrfHeaders()} : null">
<header th:replace="~{console/layout :: nav('')}"></header>
<main id="main" class="container py-4">
    <h1 class="h3" th:text="${problem.status() == 404} ? 'Not found' : 'The request could not be completed'">Error</h1>
    <div th:replace="~{console/fragments :: problem}"></div>
    <p><a href="/console/runs">Back to runs</a></p>
</main>
</body>
</html>
