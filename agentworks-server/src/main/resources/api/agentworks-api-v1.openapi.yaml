  /api/v1/runs/{id}/stream:
    get:
      operationId: streamRunEvents
      tags: [Runs]
      summary: The run's typed events as a reconnectable Server-Sent Events stream.
      description: |
        Each run event is one SSE event: `event` is the run event type, `id` is `<runId>:<sequence>`, and `data` is
        the `RunEvent` envelope. Events arrive once each, in gapless sequence order.

        * **Resume.** On reconnect send `Last-Event-ID` (browsers do this automatically); delivery continues with
          the next sequence, without gap or duplicate. A first connection may start after a known sequence with
          `cursor`. The header wins over the parameter. A malformed id is 400 `INVALID_LAST_EVENT_ID`; an id of
          another stream is 400 `LAST_EVENT_ID_MISMATCH`; a position beyond the run is 409
          `EVENT_SEQUENCE_AHEAD`; a position before retained history is 410 `EVENT_HISTORY_EXPIRED`. The last two
          carry `currentSequence`: re-read the run and continue from there.
        * **Control events** carry no `id`, so they never move the client's position: `stream-end` (data
          `StreamEnd`) follows the run's terminal event and the server closes the stream; `reconnect` (data
          `StreamReconnect`) means the stream reached its maximum duration (`MAX_DURATION`), the node is stopping
          (`SHUTDOWN`), no stream is free now (`STREAM_LIMIT_EXCEEDED`), or no stream read is free now
          (`STREAM_BUSY`), so reconnect with `Last-Event-ID` after the `retry` hint (a stopping node and these
          refusals answer with only this event);
          `stream-error` (data `StreamError`) ends the stream with a stable code. Stop on `AUTHORIZATION_REVOKED`
          (the credential or membership no longer authorizes the stream), on `CORRUPT_HISTORY` (the history does not
          verify), and on `STREAM_SUPERSEDED` (the same client, by its `client` id, reconnected to this run, so this
          stream's connection is dead). Reconnect later with `Last-Event-ID` on
          `STREAM_UNAVAILABLE` (the history or the authorization could not be read now) and on
          `UNKNOWN_EVENT_TYPE` or `UNSUPPORTED_EVENT_VERSION` (this node cannot read a newer event; another node
          may). Re-read the run and continue from its current sequence on `EVENT_HISTORY_EXPIRED`,
          `EVENT_SEQUENCE_AHEAD`, or `NOT_FOUND`.
        * **Position frame.** After the `retry` field, every connection sends one id-only frame, `id:
          <runId>:<position>`, with no `event` or `data`. It dispatches no event, but it sets the client's last event
          id, so a browser's native reconnect carries `Last-Event-ID` (and, with a `client` id, is recognized as a
          reconnect) even when no run event arrived, for example on an idle or paused run.
        * **Liveness.** The stream starts with a `retry` field, sends a `:keepalive` comment when idle, and ends
          after at most its configured maximum duration (default 10 minutes).
        * **Termination.** Reconnecting to a terminal run whose events were all delivered answers 204, which stops a
          browser `EventSource`.
        * **Security.** Authenticate with the session cookie or an `Authorization` header, never the URL. The run
          must belong to the principal's workspace (otherwise 404), and the credential and membership are
          re-checked while the stream is open.
        * **Client stream id.** `client` optionally identifies the client across its reconnects; a browser
          `EventSource` reconnects to the same URL, so it keeps it. Generate a random id such as a UUID for each
          stream connection object (for example each `EventSource`), keep it in memory only, and never share it: a
          browser that duplicates a tab copies its session storage, and the copy must not reuse the id. A
          *reconnect*, a request with both a `client` id and `Last-Event-ID`, supersedes that client's earlier
          streams of the run, at or below the limit, whatever their positions: the client reconnected, so their
          connections are dead even if the server has not noticed yet. They end with `stream-error`
          `STREAM_SUPERSEDED` and free their slots at once, also when the reconnect itself is refused by a limit.
          Only a browser's own `EventSource` reconnect sends `Last-Event-ID`, so a rebuilt connection supersedes
          nothing. A first connection (no `Last-Event-ID`), even with a known `client` id, and a request
          without a `client` id supersede nothing.
        * **Clients without a `client` id** (for example `curl` or an SDK that sends none) have no way to reclaim
          their own stream: a stream whose connection vanished without closing keeps its slot until a write to it
          fails or its maximum duration ends it (default 10 minutes), and a reconnect in the meantime may be refused
          for the principal's limit. Positions cannot tell a live stream from a dead connection, so the server never
          guesses; send a `client` id to reconnect reliably.
        * **Limits.** Too many open streams on the node, in the workspace, or for the principal answers an SSE
          client (one that accepts `text/event-stream`) with 200, a `retry` hint, and a single `reconnect` event with
          reason `STREAM_LIMIT_EXCEEDED`, because any other status stops a browser `EventSource` for good; any other
          caller gets 429 `STREAM_LIMIT_EXCEEDED`. Both carry `Retry-After`. The run and the position are checked
          before the limits, so at its limit a principal still gets 204, 404, 409, or 410 where they apply; a
          refused open therefore costs one bounded read. That read shares the streams' bound on concurrent reads and
          waits for it only briefly: when no read is free, an SSE client gets a `reconnect` with reason `STREAM_BUSY`
          and any other caller 503 `STREAM_BUSY`, both with `Retry-After`. A refusal never ends another client's
          stream. A slow client only slows its own stream; it never delays the run.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string, pattern: "^[0-9a-f-]{36}:(0|[1-9][0-9]{0,18})$"}
        - name: cursor
          in: query
          required: false
          description: Start after this event sequence on a first connection.
          schema: {type: string, pattern: "^(0|[1-9][0-9]{0,18})$"}
        - name: client
          in: query
          required: false
          description: >-
            The client's stream id, stable across its reconnects: 1 to 64 letters, digits, or hyphens (no
            underscore, so it can never take the shape of a credential). Otherwise 400 `INVALID_CLIENT_ID`.
          schema: {type: string, pattern: "^[A-Za-z0-9-]{1,64}$"}
      responses:
        "200":
          description: The event stream, or, when the node is stopping or no stream is free, a single `reconnect` event.
          headers:
            Retry-After:
              description: Present only on a refusal (stream limits, busy reads) or a stopping node; seconds to wait.
              schema: {type: integer}
          content:
            text/event-stream:
              schema: {type: string}
              x-agentworks-sse-events:
                "<RUN_EVENT_TYPE>": {$ref: "#/components/schemas/RunEvent"}
                stream-end: {$ref: "#/components/schemas/StreamEnd"}
                reconnect: {$ref: "#/components/schemas/StreamReconnect"}
                stream-error: {$ref: "#/components/schemas/StreamError"}
        "204":
          description: The run is terminal and every event was already delivered; do not reconnect.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "410": {$ref: "#/components/responses/Gone"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

