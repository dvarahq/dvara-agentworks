      parameters:
        - {name: operationId, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
      responses:
        "200": {description: The cancelled operation., content: {application/json: {schema: {$ref: "#/components/schemas/DurableOperation"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/operation-callbacks/{workspaceId}/{operationId}:
    post:
      operationId: completeDurableOperationCallback
      tags: [Operations]
      summary: Records a provider's token-authenticated terminal operation result.
      description: The callback token is compared by digest, never returned, logged, or stored in clear text.
      security: []
      x-agentworks-authorization: {need: PUBLIC}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Exactly one callback, poll, or cancellation wins; a repeat is 409 ALREADY_TERMINAL.
      parameters:
        - {name: workspaceId, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
        - {name: operationId, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
        - {name: Dvara-Operation-Token, in: header, required: true, schema: {type: string, minLength: 1}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/OperationCallbackRequest"}}}
      responses:
        "204": {description: The terminal result was recorded and the run resumed.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/interactions:
    get:
      operationId: listInteractions
      tags: [Interactions]
      summary: Lists durable human interactions newest first.
      description: >-
        Returns only interactions in the authenticated workspace, optionally filtered by exact status and run.
        The cursor is the created-at/id keyset position and must be reused with the same filters. Sensitive outcome
        values, credential material, and interaction idempotency keys are never returned.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [OPEN, RESPONDED, EXPIRED, CANCELLED, REVOKED]}
        - name: runId
          in: query
          required: false
          schema: {$ref: "#/components/schemas/Uuid"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A keyset page of interactions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanInteractionPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/interactions/{interactionId}:
    get:
      operationId: getInteraction
      tags: [Interactions]
      summary: A durable human interaction and its exact run pins.
      description: >-
        Returns only the authenticated workspace's interaction. Free-text answers and form values in a terminal
        outcome are redacted; an authorization prompt exposes only its credential reference and scopes, never
        credential material. The run-scoped idempotency key is not exposed.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - name: interactionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: The interaction.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanInteraction"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/interactions/{interactionId}/response:
    post:
      operationId: respondToInteraction
      tags: [Interactions]
      summary: Records the assigned principal's typed response and resumes the exact pinned run.
      description: |
        `INTERACTION_RESPOND` is the outer application permission. The PostgreSQL authority separately requires
        the authenticated identity to match the interaction's WORKSPACE, USER, SESSION, or DELEGATED_SUBJECT
        assignment. Recording the one-winner terminal response and resuming the blocked run commits in one local
        Spring JDBC transaction. A repeat is 409 `ALREADY_TERMINAL` and cannot create another outcome or resume.
      x-agentworks-authorization: {need: PERMISSION, permission: INTERACTION_RESPOND}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: A repeat is 409 `ALREADY_TERMINAL`; exactly one outcome can resume the run.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HumanInteractionResponseRequest"}
      responses:
        "200":
          description: The responded interaction after its pinned run was atomically resumed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanInteraction"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/interactions/{interactionId}/expire:
    post:
      operationId: expireInteraction
      tags: [Interactions]
      summary: Expires an interaction whose database-authored deadline has arrived.
      description: >-
        An operator with `RUN_ADMIT` records `EXPIRED` and resumes the exact pinned run in one local Spring JDBC
        transaction. PostgreSQL time is authoritative; an early attempt is 409 `DEADLINE_NOT_REACHED`.
      x-agentworks-authorization: {need: PERMISSION, permission: RUN_ADMIT}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Exactly one terminal outcome wins; a repeat is 409 `ALREADY_TERMINAL`.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: The expired interaction after its pinned run was atomically resumed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanInteraction"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/interactions/{interactionId}/cancel:
    post:
      operationId: cancelInteraction
      tags: [Interactions]
      summary: Cancels an open interaction and resumes its exact pinned run.
      description: >-
        An operator with `RUN_ADMIT` records `CANCELLED` and resumes the exact pinned run in one local Spring JDBC
        transaction. Exactly one response, expiry, cancellation, or revocation can win.
      x-agentworks-authorization: {need: PERMISSION, permission: RUN_ADMIT}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Exactly one terminal outcome wins; a repeat is 409 `ALREADY_TERMINAL`.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: The cancelled interaction after its pinned run was atomically resumed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanInteraction"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/interactions/{interactionId}/revoke:
    post:
      operationId: revokeInteraction
      tags: [Interactions]
      summary: Revokes an open authorization interaction and resumes its exact pinned run.
      description: >-
        An operator with `RUN_ADMIT` may record `REVOKED` only for an authorization interaction. The outcome and
        exact pinned-run resume commit together; another interaction kind is 409 `INVALID_TRANSITION`.
      x-agentworks-authorization: {need: PERMISSION, permission: RUN_ADMIT}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Exactly one terminal outcome wins; a repeat is 409 `ALREADY_TERMINAL`.
      parameters:
        - name: interactionId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: The revoked authorization interaction after its pinned run was atomically resumed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanInteraction"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/artifacts:
    post:
      operationId: uploadArtifact
      tags: [Artifacts]
      summary: Uploads one immutable artifact after bounded validation and content scanning.
      description: >-
        The request body is the artifact bytes. Content-Length is required; X-Artifact-SHA256 may carry the
        expected lowercase SHA-256 hex digest. Content is staged, verified, scanned, and atomically published.
        Unsafe or opaque content is retained in quarantine but cannot be downloaded.
      x-agentworks-authorization: {need: PERMISSION, permission: ARTIFACT_WRITE}
      x-agentworks-idempotency: none
      parameters:
        - name: X-Artifact-SHA256
          in: header
          required: false
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
        - name: classification
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ArtifactClassification"}
        - name: redacted
          in: query
          required: false
          schema: {type: boolean, default: false}
        - name: expiresAt
          in: query
          required: false
          schema: {$ref: "#/components/schemas/Timestamp"}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
          application/json:
            schema: {type: string, format: binary}
          text/plain:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: The immutable artifact metadata.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
