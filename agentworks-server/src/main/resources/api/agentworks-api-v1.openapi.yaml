        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/runs/{id}/pause:
    post:
      operationId: pauseRun
      tags: [Runs]
      summary: Pauses a run at its next safe boundary.
      description: |
        A queued run pauses at once (200, `PAUSED`), and so does an active run whose worker is gone (its lease
        expired) and that has no effect in doubt: the lease fence advances, so the lost worker can never write again.
        Any other active run pauses only when its executor declares that it resumes a mid-exchange pause without
        repeating completed model rounds or tool calls; otherwise the answer is 409 `PAUSE_UNSAFE` and nothing is
        written. The Spring AI executor checkpoints only its final response and does not declare it, so its active runs
        are refused until per-round checkpoints (#44); a node whose executors declare nothing refuses every such pause.
        For an executor that declares it, the answer is 202 with the run as it still is (`ACTIVE`, with
        `inDoubtEffects` when effects are in doubt), and the request is durable: the run pauses at its next safe
        boundary, and never while an effect is in doubt. Safe boundaries are enforced by the worker right after a
        checkpoint, before an effect starts, and at a recovery claim, and by the executor at boundaries of its own; the
        check and the pause are one atomic write. Nothing already dispatched is reported as rolled back. The stream
        then shows `RUN_PAUSED`, whose payload names the requesting actor (`requestedBy`), the reason
        `OPERATOR_REQUESTED`, and `inDoubtEffects`. Whatever ends or blocks the run before that boundary (completion,
        failure, a limit, cancellation, or a block) wins, its event names the requester (`pauseRequestedBy`), and the
        request ends with it. A paused run resumes through `POST /runs/{id}/resume`, which also withdraws a request the
        run has not reached yet, so a withdrawn request never pauses the run. Requests and withdrawals are recorded in
        the authentication and administration audit trail with the actor, in the same transaction as the change, so
        a request or withdrawal whose record cannot be written changes nothing; a repeat that changes nothing is not
        recorded again. A blocked run is 409 `RUN_BLOCKED` (cancel it, or pause it once it resumes); a run not yet queued is
        409 `RUN_NOT_QUEUED`; an active run that cannot pause safely is 409 `PAUSE_UNSAFE`; a queued run of a cohort
        that admits no work is 409 `COHORT_NOT_ADMITTING`; a terminal run is 409 `RUN_TERMINAL`. The run's pins never
        change (ADR-030).
      x-agentworks-authorization: {need: PERMISSION, permission: RUN_ADMIT}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Pausing a paused run returns it unchanged (200); repeating a pending request keeps the first one (202).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandRequest"}
      responses:
        "200":
          description: The paused run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "202":
          description: The pause is requested; the active run pauses at its next safe boundary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/runs/{id}/resume:
    post:
      operationId: resumeRun
      tags: [Runs]
      summary: Resumes a paused run to the queue.
      description: |
        A blocked run resumes only through the completion that unblocks it (409 `RUN_BLOCKED`); an active run is
        409 `RUN_ACTIVE`, unless it has a pause request it has not reached yet, which the resume withdraws (200, the run
        unchanged, audited); a terminal run is 409 `RUN_TERMINAL`.
      x-agentworks-authorization: {need: PERMISSION, permission: RUN_ADMIT}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Resuming a queued run returns it unchanged.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The queued run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/sessions:
