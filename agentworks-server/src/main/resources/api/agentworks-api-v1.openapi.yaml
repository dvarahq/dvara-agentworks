openapi: 3.1.0
info:
  title: Dvara AgentWorks API
  version: "1"
  summary: Versioned REST and Server-Sent Events contract of Dvara AgentWorks Core.
  description: |
    The `/api/v1` contract of Dvara AgentWorks Core (issue #35). Every capability the Web Console and CLI use is
    available here; there is no UI-only control path.

    ## Versioning and deprecation
    * `/api/v1` is first frozen by this description (issue #35). Nothing earlier was released; the provisional
      endpoints of issues #30, #31, #32, and #74 changed shape once, before this freeze (the implementation record
      of issue #35 lists each change). From this description on, the rules below apply.
    * The major version is part of the path (`/api/v1`). Within a major version changes are additive only: new
      operations, optional parameters and headers, response fields, problem codes, event types, and enumeration
      values. Clients must ignore unknown fields and SSE events and must treat unknown enumeration values and
      problem codes as opaque.
    * A breaking change ships only under a new major version path, served alongside the previous one.
    * A deprecated operation is marked `deprecated: true` here and answers with the `Deprecation` header
      (RFC 9745) and a `Sunset` header (RFC 8594) at least 180 days before removal; removal happens only in a new
      major version. No v1 operation is deprecated today.
    * The run event envelope carries `envelopeVersion` (currently 1). Each event carries its payload's recorded
      `schemaVersion` and its `servedSchemaVersion`; older recorded payloads are served lifted to the current version.

    ## Authentication and authorization
    Every operation except sign-in, bootstrap, provider operation callbacks, and this document requires a credential: an API token in
    `Authorization: Bearer awt_...` or the `__Host-agentworks-session` browser cookie. A state-changing request
    authenticated by the cookie must also carry `X-CSRF-Token`. A credential anywhere in the URL is refused with
    400 `CREDENTIAL_IN_URL`. `x-agentworks-authorization` names the workspace permission or session capability
    each operation needs; anything unlisted is denied. Resources of another workspace are indistinguishable from
    absent ones (404 `NOT_FOUND`).

    ## Errors
    Every error is an RFC 9457 problem document (`application/problem+json`) with a stable upper-case `code`; the
    `type` is `urn:dvaraos:problem:<code in kebab case>`. The `detail` is fixed text that never echoes request
    content or credentials, and no problem carries an `instance`. Unexpected failures are 500 `INTERNAL_ERROR`
    with an opaque `errorId` for operators; database unavailability is 503 `SERVICE_UNAVAILABLE` with
    `Retry-After`. Any operation may also answer these generic problems: 400 `MALFORMED_REQUEST`, 404 `NOT_FOUND`,
    405 `METHOD_NOT_ALLOWED`, 406 `NOT_ACCEPTABLE`, 413 `CONTENT_TOO_LARGE`, 414 `URI_TOO_LONG`, 415
    `UNSUPPORTED_MEDIA_TYPE`, 431 `HEADERS_TOO_LARGE`, or another 4xx `REQUEST_REJECTED`, including for requests
    the HTTP server rejects before routing.

    ## Collections
    Every list operation returns `{"items": [...], "nextCursor": ...}`. Paged collections accept `limit`
    (default 50, at most 200; run events default 100, at most 200) and `cursor`, the `nextCursor` of the previous
    page with the same filters; `nextCursor` is `null` on the last page. Cursors are opaque except for run events,
    whose cursor is the decimal sequence of the last event read. Collections marked unpaged are bounded and
    always complete.

    ## Idempotency and concurrency
    `x-agentworks-idempotency` states each mutation's retry behavior:
    * `key`: the operation accepts `Idempotency-Key` (1 to 255 visible ASCII characters). A retry with the same
      key and the same request returns the original result with `Idempotent-Replayed: true` and creates no second
      resource or effect; the same key with a different request is 409 `IDEMPOTENCY_KEY_REUSED`, and no mutation
      happens. Lifecycle command results are replayable for the configured replay window (default 24 hours); after
      compaction a retry is 409 `IDEMPOTENCY_RESULT_EXPIRED` and still never executes again. Run admission keys
      never expire. Without configured idempotency keys on the server, a keyed request is 422
      `IDEMPOTENCY_UNAVAILABLE`. The request a key is compared with includes the credential that sent it: a
      browser session counts as its user (signing in again keeps it), and an API token as that token. So retry
      through the same token, or through sessions of the same user: a retry of the same request through another
      token (a rotated one, for example) or through a session instead of a token is 409
      `IDEMPOTENCY_KEY_REUSED`, never a second resource or effect.
    * `natural`: repeating the request cannot create a second resource or effect; the operation description says
      what a repeat returns.
    * `none`: each request is a new effect (sign-in issues a new session, a password reset issues a new password).

    Optimistic concurrency uses strong ETags: `If-Match` carries the expected version on the operations that
    document it, and a stale value is 412 `STALE_VERSION`. Database time governs leases, deadlines, and
    lifecycle cutoffs.

    ## Correlation
    Run representations and run events carry the run, workspace, release, deployment, deployment revision,
    runtime cohort, and trace identities, and each event its gapless per-run `sequence`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: Authentication
  - name: Users and memberships
  - name: API tokens
  - name: Administrative audit
  - name: Diagnostics
  - name: Agents
  - name: Capabilities
  - name: Tool permissions
  - name: Releases
  - name: Environments
  - name: Deployments
  - name: Runs
  - name: Sessions
  - name: Operations
  - name: Interactions
  - name: Artifacts
  - name: Evaluations
  - name: API description
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiDescription
      tags: [API description]
      summary: This OpenAPI description.
      security: []
      x-agentworks-authorization: {need: PUBLIC}
      responses:
        "200":
          description: The OpenAPI 3.1 description of the `/api/v1` contract.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/yaml:
              schema: {type: string}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/login:
    post:
      operationId: signIn
      tags: [Authentication]
      summary: Signs in with a password and issues a browser session.
      description: |
        Issues a new `__Host-agentworks-session` cookie (Secure, HttpOnly, SameSite=Strict) and revokes any session
        the browser presented. Every failure is the same 401 `AUTHENTICATION_FAILED`. Attempts are limited per
        client address and per account (429 `TOO_MANY_ATTEMPTS` with `Retry-After`).
      security: []
      x-agentworks-authorization: {need: PUBLIC}
      x-agentworks-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: The new session; `csrfToken` must accompany state-changing cookie requests.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/bootstrap:
    post:
      operationId: completeBootstrap
      tags: [Authentication]
      summary: Consumes the one-time installation bootstrap token and creates the first administrator.
      description: Every invalid, expired, consumed, or late attempt is the same 403 `BOOTSTRAP_UNAVAILABLE`.
      security: []
      x-agentworks-authorization: {need: PUBLIC}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: The token is consumed exactly once; a repeat is 403 `BOOTSTRAP_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BootstrapRequest"}
      responses:
        "201":
          description: The first administrator.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BootstrapCompleted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Authentication]
      summary: The authenticated principal.
      x-agentworks-authorization: {need: AUTHENTICATED}
      responses:
        "200":
          description: The principal; `csrfToken` is present only for a browser session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/logout:
    post:
      operationId: signOut
      tags: [Authentication]
      summary: Revokes the current browser session.
      x-agentworks-authorization: {need: SESSION}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: A revoked session no longer authenticates, so a repeat is 401.
      responses:
        "204": {description: Signed out.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [Authentication]
      summary: Changes the password, revokes every session of the user, and issues a fresh session.
      x-agentworks-authorization: {need: SESSION}
      x-agentworks-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChange"}
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/workspaces:
    get:
      operationId: listMyWorkspaces
      tags: [Authentication]
      summary: The workspaces the signed-in user is a member of (unpaged).
      x-agentworks-authorization: {need: ACTIVE_SESSION}
      responses:
        "200":
          description: The user's workspaces.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspacePage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/session/workspace:
    put:
      operationId: selectWorkspace
      tags: [Authentication]
      summary: Moves the browser session into another of the user's workspaces under a new session value.
      x-agentworks-authorization: {need: ACTIVE_SESSION}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Selecting the same workspace again rotates the session value again.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceSelection"}
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/sessions:
    get:
      operationId: listMySessions
      tags: [Authentication]
      summary: The signed-in user's live sessions (unpaged; at most five).
      x-agentworks-authorization: {need: ACTIVE_SESSION}
      responses:
        "200":
          description: The user's sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionSummaryPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags: [Authentication]
      summary: Revokes one of the signed-in user's sessions.
      x-agentworks-authorization: {need: ACTIVE_SESSION}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Revoking an already revoked session answers 204 again.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": {description: Revoked.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [Users and memberships]
      summary: The organization's users (unpaged).
      x-agentworks-authorization: {need: ORGANIZATION_ADMIN}
      responses:
        "200":
          description: The organization's users.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createUser
      tags: [Users and memberships]
      summary: Creates a user with a temporary password that must be changed.
      x-agentworks-authorization: {need: ORGANIZATION_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Usernames are unique; a repeat is 409 `USERNAME_TAKEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUserRequest"}
      responses:
        "201":
          description: The user and its temporary password, shown once.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/users/{id}/password-reset:
    post:
      operationId: resetUserPassword
      tags: [Users and memberships]
      summary: Issues a temporary password and revokes every session and API token of the user.
      x-agentworks-authorization: {need: ORGANIZATION_ADMIN}
      x-agentworks-idempotency: none
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The user and its temporary password, shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/users/{id}/disable:
    post:
      operationId: disableUser
      tags: [Users and memberships]
      summary: Disables a user and revokes its sessions and API tokens.
      x-agentworks-authorization: {need: ORGANIZATION_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Disabling a disabled user returns it unchanged.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/users/{id}/enable:
    post:
      operationId: enableUser
      tags: [Users and memberships]
      summary: Enables a user and clears any lockout.
      x-agentworks-authorization: {need: ORGANIZATION_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Enabling an enabled user returns it unchanged.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/members:
    get:
      operationId: listMembers
      tags: [Users and memberships]
      summary: The workspace's members (unpaged).
      x-agentworks-authorization: {need: PERMISSION, permission: MEMBER_ADMIN}
      responses:
        "200":
          description: The workspace's members.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/members/{userId}:
    put:
      operationId: putMember
      tags: [Users and memberships]
      summary: Grants a workspace role to a user of the organization, or changes it.
      x-agentworks-authorization: {need: SESSION_AND_PERMISSION, permission: MEMBER_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Granting the role a member already holds answers 200 with the membership.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetRoleRequest"}
      responses:
        "200":
          description: The changed membership.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Membership"}
        "201":
          description: The new membership.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Membership"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removeMember
      tags: [Users and memberships]
      summary: Removes a membership with the sessions and API tokens bound to it; the last administrator stays.
      x-agentworks-authorization: {need: SESSION_AND_PERMISSION, permission: MEMBER_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Removing a removed membership is 404 `NOT_FOUND`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": {description: Removed.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/tokens:
    get:
      operationId: listTokens
      tags: [API tokens]
      summary: The caller's API tokens; `all=true` lists every member's and needs `TOKEN_ADMIN` (unpaged).
      x-agentworks-authorization: {need: PERMISSION, permission: TOKEN_SELF}
      parameters:
        - name: all
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Token metadata; token values are never listed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createToken
      tags: [API tokens]
      summary: Creates an API token from an interactive session; the value is returned once.
      x-agentworks-authorization: {need: SESSION_AND_PERMISSION, permission: TOKEN_SELF}
      x-agentworks-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTokenRequest"}
      responses:
        "201":
          description: The token metadata and its value, shown once.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedToken"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [API tokens]
      summary: Revokes one of the caller's tokens, or any with `TOKEN_ADMIN`.
      x-agentworks-authorization: {need: PERMISSION, permission: TOKEN_SELF}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Revoking a revoked token answers 204 again.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": {description: Revoked.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/administrative-audit:
    get:
      operationId: listAdministrativeAudit
      tags: [Administrative audit]
      summary: Immutable administrative audit facts, newest first.
      description: |
        Returns the current workspace's append-only authentication and control-plane audit facts. Credential
        identifiers and network addresses are deliberately omitted. `integrityDigest` is a stable SHA-256 digest
        of the returned fact; database guards prevent mutation or deletion of the underlying row.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - name: eventType
          in: query
          required: false
          schema: {$ref: "#/components/schemas/StableCode"}
        - name: outcome
          in: query
          required: false
          schema: {$ref: "#/components/schemas/StableCode"}
        - name: targetType
          in: query
          required: false
          schema: {$ref: "#/components/schemas/StableCode"}
        - name: targetId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One redacted page of audit facts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdministrativeAuditPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/diagnostics/support-bundle:
    get:
      operationId: downloadSupportBundle
      tags: [Diagnostics]
      summary: Downloads a bounded, redacted diagnostic snapshot for the current workspace.
      description: |
        The attachment contains aggregate durable-state counts and age markers. When `traceId` is supplied it also
        contains content-free run, event, artifact, and operation identities for that trace. It never selects payload,
        prompt, response, actor, address, credential, or configuration-value columns.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - name: traceId
          in: query
          required: false
          schema: {type: string, pattern: "^[0-9a-fA-F]{32}$"}
      responses:
        "200":
          description: Redacted JSON attachment.
          headers:
            Content-Disposition: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupportBundle"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/ContentTooLarge"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      summary: Agent definitions ordered by name, then id.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of definitions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentDefinitionPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
