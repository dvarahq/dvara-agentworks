        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: A sequence page of inbox messages., content: {application/json: {schema: {$ref: "#/components/schemas/InboxMessagePage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/sessions/{sessionId}/messages/{messageId}:
    get:
      operationId: getSessionMessage
      tags: [Sessions]
      summary: Returns one session inbox message and its immutable run pins.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
        - {name: messageId, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
      responses:
        "200": {description: The inbox message., content: {application/json: {schema: {$ref: "#/components/schemas/InboxMessage"}}}}
