  /api/v1/operations/{operationId}/cancel:
    post:
      operationId: cancelDurableOperation
      tags: [Operations]
      summary: Requests provider cancellation and records the one winning terminal outcome.
      x-agentworks-authorization: {need: PERMISSION, permission: RUN_ADMIT}
