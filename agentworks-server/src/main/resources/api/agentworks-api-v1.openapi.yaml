  /api/v1/sessions/{sessionId}/messages:
    post:
      operationId: deliverSessionMessage
      tags: [Sessions]
      summary: Durably delivers a message, creating a currently routed root run when runId is absent.
      description: A retry preserves the original run and immutable pins even after deployment promotion.
      x-agentworks-authorization: {need: PERMISSION, permission: RUN_ADMIT}
      x-agentworks-idempotency: key
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
