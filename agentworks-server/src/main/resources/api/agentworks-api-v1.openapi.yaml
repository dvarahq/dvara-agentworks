        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/ContentTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      operationId: listArtifacts
      tags: [Artifacts]
      summary: Lists accepted active artifact metadata newest first.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - name: mediaType
          in: query
          required: false
          schema: {type: array, items: {type: string}}
        - name: classification
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ArtifactClassification"}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A keyset page of artifact metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtifactPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [Artifacts]
      summary: Returns tenant-scoped artifact metadata and provenance.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
      responses:
        "200":
          description: Artifact metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/artifacts/{artifactId}/content:
    get:
      operationId: downloadArtifact
      tags: [Artifacts]
      summary: Streams accepted active artifact content with single-range support.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - name: Range
          in: header
          required: false
          schema: {type: string, pattern: "^bytes=[0-9]+-[0-9]*$"}
      responses:
        "200":
          description: Complete artifact content using the artifact's recorded media type.
          content:
            "*/*":
              schema: {type: string, format: binary}
        "206":
          description: Requested artifact byte range using the artifact's recorded media type.
          content:
            "*/*":
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416": {$ref: "#/components/responses/Problem"}
        "423": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/artifacts/{artifactId}/expire:
    post:
      operationId: expireArtifact
      tags: [Artifacts]
      summary: Marks an unpinned artifact expired so maintenance can reclaim it.
      x-agentworks-authorization: {need: PERMISSION, permission: ARTIFACT_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: A repeat cannot restore or delete the artifact and returns the current expired state.
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
      responses:
        "200":
          description: Expired artifact metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/artifacts/{artifactId}/validation:
    post:
      operationId: changeArtifactValidation
      tags: [Artifacts]
      summary: Records an administrative validation or quarantine decision.
      x-agentworks-authorization: {need: PERMISSION, permission: ARTIFACT_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Repeating the same decision leaves the artifact in the same validation state.
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ArtifactValidationRequest"}
      responses:
        "200":
          description: Updated artifact metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/artifacts/{artifactId}/pins:
    get:
      operationId: listArtifactPins
      tags: [Artifacts]
      summary: Lists active retention pins for an artifact.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
      responses:
        "200":
          description: The bounded complete pin list.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtifactPinPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: pinArtifact
      tags: [Artifacts]
      summary: Adds an explicit run, release, evaluation, audit, or retention pin.
      x-agentworks-authorization: {need: PERMISSION, permission: ARTIFACT_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: The artifact, kind, and subject identify one pin; a repeat returns that pin.
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ArtifactPinRequest"}
      responses:
        "201":
          description: The pin.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtifactPin"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/artifacts/{artifactId}/pins/{pinId}:
    delete:
      operationId: unpinArtifact
      tags: [Artifacts]
      summary: Removes one explicit retention pin.
      x-agentworks-authorization: {need: PERMISSION, permission: ARTIFACT_ADMIN}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Removing an already absent pin has no additional effect.
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - name: pinId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "204": {description: Pin removed}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-datasets:
    post:
      operationId: createEvaluationDataset
      tags: [Evaluations]
      summary: Creates one immutable, versioned evaluation dataset.
      x-agentworks-authorization: {need: PERMISSION, permission: AGENT_WRITE}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Dataset name and version are unique; a conflicting repeat is refused.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateEvaluationDataset"}}}}
      responses:
        "201": {description: Immutable dataset, headers: {Location: {$ref: "#/components/headers/Location"}}, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationDataset"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      operationId: listEvaluationDatasets
      tags: [Evaluations]
      summary: Lists the workspace's immutable evaluation datasets.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      responses:
        "200": {description: Bounded complete dataset list, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationDatasetPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-datasets/{id}:
    get:
      operationId: getEvaluationDataset
      tags: [Evaluations]
      summary: Returns an immutable dataset; sensitive case bodies are redacted.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters: [{name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}]
      responses:
        "200": {description: Dataset, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationDataset"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-datasets/purge-expired:
    post:
      operationId: purgeExpiredEvaluationFixtures
      tags: [Evaluations]
      summary: Irreversibly removes case bodies from sensitive datasets whose retention expired.
      x-agentworks-authorization: {need: PERMISSION, permission: AGENT_WRITE}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Repeating cleanup finds no case bodies already purged.
      responses:
        "200":
          description: Cleanup count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [purgedCases]
                properties:
                  purgedCases: {type: integer, minimum: 0}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluators:
    post:
      operationId: createEvaluator
      tags: [Evaluations]
      summary: Creates a validated immutable deterministic evaluator.
      x-agentworks-authorization: {need: PERMISSION, permission: AGENT_WRITE}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Evaluator name and version are unique; a conflicting repeat is refused.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateEvaluator"}}}}
      responses:
        "201": {description: Evaluator, headers: {Location: {$ref: "#/components/headers/Location"}}, content: {application/json: {schema: {$ref: "#/components/schemas/Evaluator"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      operationId: listEvaluators
      tags: [Evaluations]
      summary: Lists deterministic evaluators.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      responses:
        "200": {description: Bounded complete evaluator list, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluatorPage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluators/{id}:
    get:
      operationId: getEvaluator
      tags: [Evaluations]
      summary: Returns one immutable evaluator.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters: [{name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}]
      responses:
        "200": {description: Evaluator, content: {application/json: {schema: {$ref: "#/components/schemas/Evaluator"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-runs:
    post:
      operationId: startEvaluation
      tags: [Evaluations]
      summary: Evaluates captured, effect-free observations and persists a machine-readable report.
      description: The body idempotency key identifies the immutable plan. Results commit independently so failed or cancelled runs resume without repeating completed evaluator work.
      x-agentworks-authorization: {need: PERMISSION, permission: AGENT_WRITE}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: The body idempotency key returns the original run for the same request and refuses a different request.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StartEvaluation"}}}}
      responses:
        "201": {description: Evaluation report, headers: {Location: {$ref: "#/components/headers/Location"}}, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationReport"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-runs/{id}:
    get:
      operationId: getEvaluationRun
      tags: [Evaluations]
      summary: Returns evaluation progress and immutable identities.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters: [{name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}]
      responses:
        "200": {description: Evaluation run, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationRun"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-runs/{id}/report:
    get:
      operationId: getEvaluationReport
      tags: [Evaluations]
      summary: Returns and verifies a machine-readable evaluation report.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters: [{name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}]
      responses:
        "200": {description: Verified report, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationReport"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-runs/{id}/cancel:
    post:
      operationId: cancelEvaluation
      tags: [Evaluations]
      summary: Requests cancellation at the next evaluator boundary.
      x-agentworks-authorization: {need: PERMISSION, permission: AGENT_WRITE}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Repeats preserve the same cancellation request or terminal run.
      parameters: [{name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}]
      responses:
        "200": {description: Evaluation run, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationRun"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-runs/{id}/resume:
    post:
      operationId: resumeEvaluation
      tags: [Evaluations]
      summary: Resumes a failed or cancelled run without repeating committed results.
      x-agentworks-authorization: {need: PERMISSION, permission: AGENT_WRITE}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Completed evaluator cells remain immutable and are skipped on every repeat.
      parameters: [{name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}]
      responses:
        "200": {description: Evaluation report, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationReport"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-baselines:
    post:
      operationId: createEvaluationBaseline
      tags: [Evaluations]
      summary: Creates an immutable baseline from a completed report.
      x-agentworks-authorization: {need: PERMISSION, permission: AGENT_WRITE}
      x-agentworks-idempotency: natural
      x-agentworks-idempotency-description: Baseline name and version are unique; a conflicting repeat is refused.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateEvaluationBaseline"}}}}
      responses:
        "201": {description: Baseline, headers: {Location: {$ref: "#/components/headers/Location"}}, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationBaseline"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      operationId: listEvaluationBaselines
      tags: [Evaluations]
      summary: Lists immutable evaluation baselines.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      responses:
        "200": {description: Bounded complete baseline list, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationBaselinePage"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Problem"}

  /api/v1/evaluation-baselines/{id}/comparison:
    get:
      operationId: compareEvaluationBaseline
      tags: [Evaluations]
      summary: Compares a candidate report with a compatible immutable baseline.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
      parameters:
        - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
        - {name: candidateRunId, in: query, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
      responses:
        "200": {description: Deterministic comparison, content: {application/json: {schema: {$ref: "#/components/schemas/EvaluationComparison"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Problem"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API token (`awt_...`), bound to one workspace, expiring, and revocable.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-agentworks-session
      description: |
        A browser session from `POST /api/v1/auth/login`. State-changing requests also carry the session's
        `X-CSRF-Token` header. The `local` profile names the cookie `agentworks-session`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DefinitionId:
      name: definitionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AliasName:
      name: name
      in: path
      required: true
      schema: {type: string}
    ToolNamespace:
      name: namespace
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z][a-z0-9.-]{0,63}$"}
    ToolName:
      name: name
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z][a-z0-9.-]{0,63}$"}
    ToolVersion:
      name: version
      in: path
      required: true
      schema: {type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$"}
    PackId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"}
    PackVersion:
      name: version
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"}
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page, with the same filters.
      schema: {type: string, maxLength: 1024}
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page; out of range is 400 `INVALID_LIMIT`.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A client-chosen key scoping retries of this mutation (see `x-agentworks-idempotency`).
      schema: {type: string, minLength: 1, maxLength: 255}
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: The expected version ETag; absent is 428 `PRECONDITION_REQUIRED`, stale is 412 `STALE_VERSION`.
      schema: {type: string}
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: The expected version ETag; stale is 412 `STALE_VERSION`.
      schema: {type: string}
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Uuid"}

  headers:
    Location:
      description: The URL of the created or referenced resource.
      schema: {type: string}
    ETag:
      description: A strong entity tag (version, sequence, or digest).
      schema: {type: string}
    IdempotentReplayed:
      description: "`true` when the response replays the result of an earlier request with the same key."
      schema: {type: string, enum: ["true"]}

  responses:
    Problem:
      description: A problem document.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    BadRequest:
      description: |
        The request is malformed: `MALFORMED_REQUEST`, `INVALID_CURSOR`, `INVALID_LIMIT`, `INVALID_FILTER`,
        `INVALID_PRECONDITION`, `INVALID_IDEMPOTENCY_KEY`, `INVALID_LAST_EVENT_ID`, `LAST_EVENT_ID_MISMATCH`,
        `INVALID_CLIENT_ID`, `INVALID_EVENT_POSITION`, `INVALID_CAPABILITY`, `MALFORMED_DOCUMENT`, or
        `CREDENTIAL_IN_URL`.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: No valid credential (`AUTHENTICATION_REQUIRED` or `AUTHENTICATION_FAILED`).
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: |
        The principal may not perform the operation: `ACCESS_DENIED`, `CSRF_TOKEN_INVALID`,
        `PASSWORD_CHANGE_REQUIRED`, `WORKSPACE_SCOPE_UNAVAILABLE`, `ROLE_NOT_GRANTABLE`, `BOOTSTRAP_UNAVAILABLE`,
        or `UNAUTHORIZED_RESPONDER`.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: Absent, or in another workspace (`NOT_FOUND`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: |
        A typed conflict with authoritative state, for example `IDEMPOTENCY_KEY_REUSED`,
        `IDEMPOTENCY_RESULT_EXPIRED`, `IDEMPOTENCY_KEY_VERSION_RETIRED`, `IDEMPOTENCY_NAMESPACE_RETIRED`,
        `AGENT_DEFINITION_EXISTS`, `AGENT_VERSION_EXISTS`, `CAPABILITY_CONFLICT`,
        `CAPABILITY_LIFECYCLE_CONFLICT`, `RELEASE_NAME_EXISTS`, `ENVIRONMENT_EXISTS`,
        `USERNAME_TAKEN`, `LAST_ADMINISTRATOR`, `INVALID_TRANSITION`, `NOT_CURRENT_ROUTE`, `NO_ROUTE`,
        `COHORT_NOT_ADMITTING`, `RUN_TERMINAL`, `RUN_ACTIVE`, `RUN_BLOCKED`, `STALE_LEASE`, `CORRUPT_HISTORY`,
        `ALREADY_TERMINAL`, `DEADLINE_PASSED`, `DEADLINE_NOT_REACHED`, `IDEMPOTENCY_CONFLICT`,
        `RUN_PINS_MISMATCH`, or `EVENT_SEQUENCE_AHEAD` (with `currentSequence`). `resultId` names the existing
        result where one exists.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Gone:
      description: "`EVENT_HISTORY_EXPIRED` with `currentSequence`: re-read the run and continue from its current sequence."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PreconditionFailed:
      description: "`STALE_VERSION`: `If-Match` no longer matches the current version."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PreconditionRequired:
      description: "`PRECONDITION_REQUIRED`: this mutation requires `If-Match`."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ContentTooLarge:
      description: "`DOCUMENT_TOO_LARGE`."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    UnsupportedMediaType:
      description: "`UNSUPPORTED_MEDIA_TYPE`."
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unprocessable:
      description: |
        Valid syntax, invalid content: for example `INVALID_REQUEST` (with `diagnostics`), `AGENT_SPEC_INVALID`,
        `PASSWORD_POLICY`, `CONTINUATION_NOT_EXTERNAL`, `IDEMPOTENCY_UNAVAILABLE`, `INVALID_PAYLOAD`,
        `PAYLOAD_TOO_LARGE`, `INVALID_RESPONSE`, or `GATEWAY_NOT_CONFIGURED`.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    TooManyRequests:
      description: "`TOO_MANY_ATTEMPTS`, `STREAM_LIMIT_EXCEEDED`, or a typed admission-capacity refusal; retry after `Retry-After` seconds."
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServiceUnavailable:
      description: "`SERVICE_UNAVAILABLE`, `LIFECYCLE_RETRY_EXHAUSTED`, `STREAM_BUSY`, or `ADMISSION_DEFERRED`: retry the request."
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    Uuid: {type: string, format: uuid}
    NullableUuid: {type: [string, "null"], format: uuid}
    Timestamp: {type: string, format: date-time}
    NullableTimestamp: {type: [string, "null"], format: date-time}
    NullableString: {type: [string, "null"]}
    StableCode: {type: string, pattern: "^[A-Z][A-Z0-9_]*$", maxLength: 64}

    EvaluationCaseDefinition:
      type: object
      additionalProperties: false
      required: [id, input, expected, tags]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        input: {}
        expected: {}
        tags: {type: object, additionalProperties: {type: string}, maxProperties: 32}
    EvaluationCase:
      type: object
      additionalProperties: false
      required: [id, input, expected, tags, inputDigest, expectedDigest]
      properties:
        id: {type: string}
        input: {}
        expected: {}
        tags: {type: object, additionalProperties: {type: string}}
        inputDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        expectedDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    CreateEvaluationDataset:
      type: object
      additionalProperties: false
      required: [name, version, sensitive, cases]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        version: {type: integer, minimum: 1}
        sensitive: {type: boolean}
        expiresAt: {$ref: "#/components/schemas/NullableTimestamp"}
        cases: {type: array, minItems: 1, maxItems: 10000, items: {$ref: "#/components/schemas/EvaluationCaseDefinition"}}
    EvaluationDataset:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, version, digest, sensitive, expiresAt, createdAt, cases]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        version: {type: integer}
        digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        sensitive: {type: boolean}
        expiresAt: {$ref: "#/components/schemas/NullableTimestamp"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        cases: {type: array, items: {$ref: "#/components/schemas/EvaluationCase"}}
    EvaluationDatasetPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationDataset"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    EvaluatorType:
      type: string
      enum: [EXACT, REGEX, JSON_SCHEMA, TOOL_TRACE, POLICY, LATENCY, COST, CUSTOM_JAVA]
    CreateEvaluator:
      type: object
      additionalProperties: false
      required: [name, version, type, configuration]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        version: {type: integer, minimum: 1}
        type: {$ref: "#/components/schemas/EvaluatorType"}
        configuration: {type: object}
    Evaluator:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, version, type, configuration, digest, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        version: {type: integer}
        type: {$ref: "#/components/schemas/EvaluatorType"}
        configuration: {type: object}
        digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    EvaluatorPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Evaluator"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    EvaluationObservation:
      type: object
      additionalProperties: false
      required: [caseId, output, toolTrace, policyPassed, latencyMillis, costUsd, sourceIdentity, sourceDigest]
      properties:
        caseId: {type: string}
        output: {}
        toolTrace: {type: array, items: {type: string}, maxItems: 1000}
        policyPassed: {type: boolean}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        costUsd: {type: number, minimum: 0}
        sourceIdentity: {type: string}
        sourceDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    EvaluationBudget:
      type: object
      additionalProperties: false
      required: [maximumCostUsd, maximumCaseLatencyMillis, maximumRuntime, maximumConcurrency]
      properties:
        maximumCostUsd: {type: number, minimum: 0}
        maximumCaseLatencyMillis: {type: integer, format: int64, minimum: 0}
        maximumRuntime: {type: string, pattern: "^P"}
        maximumConcurrency: {type: integer, minimum: 1, maximum: 64}
    StartEvaluation:
      type: object
      additionalProperties: false
      required: [datasetId, evaluatorIds, subjectIdentity, observations, budget, idempotencyKey]
      properties:
        datasetId: {$ref: "#/components/schemas/Uuid"}
        evaluatorIds: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {$ref: "#/components/schemas/Uuid"}}
        subjectIdentity: {type: string}
        releaseEvidenceReference: {type: string}
        observations: {type: object, additionalProperties: {$ref: "#/components/schemas/EvaluationObservation"}}
        budget: {$ref: "#/components/schemas/EvaluationBudget"}
        idempotencyKey: {type: string, minLength: 1, maxLength: 128}
    EvaluationRunStatus:
      type: string
      enum: [RUNNING, COMPLETED, FAILED, CANCELLED, BUDGET_EXCEEDED]
    EvaluationRun:
      type: object
      additionalProperties: false
      required: [id, workspaceId, datasetId, datasetDigest, evaluatorIds, evaluatorSetDigest, subjectIdentity, releaseEvidenceReference, budget, status, cancellationRequested, completedResults, totalResults, passedResults, consumedCostUsd, maximumObservedLatencyMillis, reportDigest, failureCode, startedAt, completedAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        datasetId: {$ref: "#/components/schemas/Uuid"}
        datasetDigest: {type: string}
        evaluatorIds: {type: array, items: {$ref: "#/components/schemas/Uuid"}}
        evaluatorSetDigest: {type: string}
        subjectIdentity: {type: string}
        releaseEvidenceReference: {type: string}
        budget: {$ref: "#/components/schemas/EvaluationBudget"}
        status: {$ref: "#/components/schemas/EvaluationRunStatus"}
        cancellationRequested: {type: boolean}
        completedResults: {type: integer, minimum: 0}
        totalResults: {type: integer, minimum: 1}
        passedResults: {type: integer, minimum: 0}
        consumedCostUsd: {type: number, minimum: 0}
        maximumObservedLatencyMillis: {type: integer, format: int64, minimum: 0}
        reportDigest: {type: string}
        failureCode: {type: string}
        startedAt: {$ref: "#/components/schemas/Timestamp"}
        completedAt: {$ref: "#/components/schemas/NullableTimestamp"}
    EvaluationResult:
      type: object
      additionalProperties: false
      required: [runId, caseId, evaluatorId, passed, score, code, evidence, evidenceDigest, createdAt]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        caseId: {type: string}
        evaluatorId: {$ref: "#/components/schemas/Uuid"}
        passed: {type: boolean}
        score: {type: number, minimum: 0, maximum: 1}
        code: {type: string}
        evidence: {type: object}
        evidenceDigest: {type: string}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    EvaluationReport:
      type: object
      additionalProperties: false
      required: [version, run, results, digest]
      properties:
        version: {type: integer, const: 1}
        run: {$ref: "#/components/schemas/EvaluationRun"}
        results: {type: array, items: {$ref: "#/components/schemas/EvaluationResult"}}
        digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    CreateEvaluationBaseline:
      type: object
      additionalProperties: false
      required: [name, version, runId, thresholds, cohort]
      properties:
        name: {type: string}
        version: {type: integer, minimum: 1}
        runId: {$ref: "#/components/schemas/Uuid"}
        thresholds: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 1}}
        cohort: {type: object, additionalProperties: {type: string}}
    EvaluationBaseline:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, version, runId, reportDigest, thresholds, cohort, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        version: {type: integer}
        runId: {$ref: "#/components/schemas/Uuid"}
        reportDigest: {type: string}
        thresholds: {type: object, additionalProperties: {type: number}}
        cohort: {type: object, additionalProperties: {type: string}}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    EvaluationBaselinePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationBaseline"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    EvaluationComparison:
      type: object
      additionalProperties: false
      required: [baselineId, candidateRunId, comparable, baselinePassRate, candidatePassRate, passRateDelta, regression, reasons]
      properties:
        baselineId: {$ref: "#/components/schemas/Uuid"}
        candidateRunId: {$ref: "#/components/schemas/Uuid"}
        comparable: {type: boolean}
        baselinePassRate: {type: number}
        candidatePassRate: {type: number}
        passRateDelta: {type: number}
        regression: {type: boolean}
        reasons: {type: array, items: {type: string}}

    ArtifactClassification:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
    ArtifactValidation:
      type: string
      enum: [PENDING, ACCEPTED, QUARANTINED, REJECTED]
    ArtifactLifecycle:
      type: string
      enum: [ACTIVE, EXPIRED, DELETED]
    ArtifactProvenance:
      type: object
      additionalProperties: false
      required: [source, actor, run, inputs]
      properties:
        source: {type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$"}
        actor: {type: string}
        run:
          oneOf:
            - {$ref: "#/components/schemas/ArtifactRunBinding"}
            - {type: "null"}
        inputs:
          type: array
          uniqueItems: true
          maxItems: 256
          items: {$ref: "#/components/schemas/Uuid"}
    ArtifactRunBinding:
      type: object
      additionalProperties: false
      required: [runId, releaseId, deploymentRevisionId, cohortId]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentRevisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
    Artifact:
      type: object
      additionalProperties: false
      required: [id, mediaType, size, digest, createdAt, expiresAt, classification, redacted, validation,
                 validationReason, lifecycle, stateChangedAt, provenance]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        mediaType: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        expiresAt: {$ref: "#/components/schemas/NullableTimestamp"}
        classification: {$ref: "#/components/schemas/ArtifactClassification"}
        redacted: {type: boolean}
        validation: {$ref: "#/components/schemas/ArtifactValidation"}
        validationReason: {$ref: "#/components/schemas/NullableString"}
        lifecycle: {$ref: "#/components/schemas/ArtifactLifecycle"}
        stateChangedAt: {$ref: "#/components/schemas/Timestamp"}
        provenance: {$ref: "#/components/schemas/ArtifactProvenance"}
    ArtifactPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Artifact"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    ArtifactValidationRequest:
      type: object
      additionalProperties: false
      required: [validation]
      properties:
        validation: {$ref: "#/components/schemas/ArtifactValidation"}
        reason: {$ref: "#/components/schemas/NullableString"}
    ArtifactPinKind:
      type: string
      enum: [RUN, RELEASE, EVALUATION, AUDIT, RETENTION]
    ArtifactPinRequest:
      type: object
      additionalProperties: false
      required: [kind, subjectId]
      properties:
        kind: {$ref: "#/components/schemas/ArtifactPinKind"}
        subjectId: {$ref: "#/components/schemas/Uuid"}
        expiresAt: {$ref: "#/components/schemas/NullableTimestamp"}
    ArtifactPin:
      type: object
      additionalProperties: false
      required: [id, artifactId, kind, subjectId, createdAt, expiresAt, actor]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        artifactId: {$ref: "#/components/schemas/Uuid"}
        kind: {$ref: "#/components/schemas/ArtifactPinKind"}
        subjectId: {$ref: "#/components/schemas/Uuid"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        expiresAt: {$ref: "#/components/schemas/NullableTimestamp"}
        actor: {type: string}
    ArtifactPinPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ArtifactPin"}}
        nextCursor: {type: "null"}

    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`; operation-specific members may be added.
      required: [type, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        code: {type: string, pattern: "^[A-Z][A-Z0-9_]*$"}
        errorId: {type: string, format: uuid, description: "Correlates a 500 with the server log."}
        currentSequence: {type: integer, format: int64, minimum: 0}
        resultId: {$ref: "#/components/schemas/Uuid"}
        diagnostics:
          type: array
          items: {type: object}
      additionalProperties: true

    # Identity
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
    BootstrapRequest:
      type: object
      required: [token, username, password]
      properties:
        token: {type: string, format: password}
        username: {type: string}
        displayName: {type: string}
        password: {type: string, format: password}
        organizationName: {type: string}
        workspaceName: {type: string}
    BootstrapCompleted:
      type: object
      additionalProperties: false
      required: [userId, username, organizationId, workspaceId]
      properties:
        userId: {$ref: "#/components/schemas/Uuid"}
        username: {type: string}
        organizationId: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, format: password}
    WorkspaceSelection:
      type: object
      required: [workspaceId]
      properties:
        workspaceId: {$ref: "#/components/schemas/Uuid"}
    Session:
      type: object
      additionalProperties: false
      required: [userId, username, organizationId, workspaceId, role, permissions, organizationAdmin,
                 authenticationMethod, credentialId, mustChangePassword, expiresAt, csrfToken]
      properties:
        userId: {$ref: "#/components/schemas/Uuid"}
        username: {type: string}
        organizationId: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/NullableUuid"}
        role:
          type: [string, "null"]
          enum: [ADMIN, AUTHOR, OPERATOR, VIEWER, null]
          description: >-
            The effective role in the workspace. `null` when no workspace is selected, or for an API token
            whose permissions, narrowed by its owner's current membership, amount to no role; `permissions`
            is authoritative either way.
        permissions: {type: array, items: {type: string}}
        organizationAdmin: {type: boolean}
        authenticationMethod: {type: string}
        credentialId: {$ref: "#/components/schemas/Uuid"}
        mustChangePassword: {type: boolean}
        expiresAt: {$ref: "#/components/schemas/NullableTimestamp"}
        csrfToken: {$ref: "#/components/schemas/NullableString"}
    Workspace:
      type: object
      additionalProperties: false
      required: [workspaceId, organizationId, name, role]
      properties:
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        organizationId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        role: {type: string}
    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Workspace"}}
        nextCursor: {type: "null"}
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, workspaceId, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/NullableUuid"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        lastSeenAt: {$ref: "#/components/schemas/Timestamp"}
        expiresAt: {$ref: "#/components/schemas/Timestamp"}
        current: {type: boolean}
    SessionSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SessionSummary"}}
        nextCursor: {type: "null"}
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: {type: string}
        displayName: {type: string}
        organizationRole: {type: string, enum: [ADMIN, MEMBER]}
        workspaceRole: {type: string, enum: [ADMIN, AUTHOR, OPERATOR, VIEWER]}
    User:
      type: object
      additionalProperties: false
      required: [id, organizationId, username, displayName, organizationRole, status, mustChangePassword,
                 lockedUntil, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        organizationId: {$ref: "#/components/schemas/Uuid"}
        username: {type: string}
        displayName: {$ref: "#/components/schemas/NullableString"}
        organizationRole: {type: string}
        status: {type: string}
        mustChangePassword: {type: boolean}
        lockedUntil: {$ref: "#/components/schemas/NullableTimestamp"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    UserPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/User"}}
        nextCursor: {type: "null"}
    IssuedCredential:
      type: object
      additionalProperties: false
      required: [user, temporaryPassword]
      properties:
        user: {$ref: "#/components/schemas/User"}
        temporaryPassword: {type: string, format: password}
    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [ADMIN, AUTHOR, OPERATOR, VIEWER]}
    Member:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, role, createdAt]
      properties:
        userId: {$ref: "#/components/schemas/Uuid"}
        username: {type: string}
        displayName: {$ref: "#/components/schemas/NullableString"}
        role: {type: string}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Member"}}
        nextCursor: {type: "null"}
    Membership:
      type: object
      additionalProperties: false
      required: [userId, workspaceId, role]
      properties:
        userId: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        role: {type: string}
    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        role: {type: string, enum: [ADMIN, AUTHOR, OPERATOR, VIEWER]}
        expiresInDays: {type: integer, minimum: 1}
    Token:
      type: object
      additionalProperties: false
      required: [id, name, prefix, role, workspaceId, ownerId, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        prefix: {type: string}
        role: {type: string}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        ownerId: {$ref: "#/components/schemas/Uuid"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        expiresAt: {$ref: "#/components/schemas/Timestamp"}
        lastUsedAt: {$ref: "#/components/schemas/NullableTimestamp"}
        revokedAt: {$ref: "#/components/schemas/NullableTimestamp"}
    TokenPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Token"}}
        nextCursor: {type: "null"}
    CreatedToken:
      type: object
      additionalProperties: false
      required: [metadata, token]
      properties:
        metadata: {$ref: "#/components/schemas/Token"}
        token: {type: string, format: password, description: "The token value, shown once."}

    # Administrative audit
    AdministrativeAuditFact:
      type: object
      additionalProperties: false
      required: [id, occurredAt, eventType, outcome, actorId, authenticationMethod, targetType, targetId, detail,
        integrityDigest]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        occurredAt: {$ref: "#/components/schemas/Timestamp"}
        eventType: {$ref: "#/components/schemas/StableCode"}
        outcome: {$ref: "#/components/schemas/StableCode"}
        actorId: {$ref: "#/components/schemas/NullableUuid"}
        authenticationMethod: {$ref: "#/components/schemas/NullableString"}
        targetType: {$ref: "#/components/schemas/NullableString"}
        targetId: {$ref: "#/components/schemas/NullableUuid"}
        detail: {$ref: "#/components/schemas/NullableString"}
        integrityDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
    AdministrativeAuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AdministrativeAuditFact"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}

    # Operator diagnostics
    DiagnosticCounts:
      type: object
      additionalProperties: {type: integer, format: int64, minimum: 0}
    SupportBundle:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, workspaceDigest, redaction, snapshot]
      properties:
        schemaVersion: {type: integer, const: 1}
        generatedAt: {$ref: "#/components/schemas/Timestamp"}
        workspaceDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        redaction: {type: string}
        snapshot: {$ref: "#/components/schemas/SupportBundleSnapshot"}
    SupportBundleSnapshot:
      type: object
      additionalProperties: false
      required: [runs, cohorts, workItems, operations, inbox, interactions, artifacts, quarantinedRuns,
        oldestQueuedAt, oldestDrainAt, correlation]
      properties:
        runs: {$ref: "#/components/schemas/DiagnosticCounts"}
        cohorts: {$ref: "#/components/schemas/DiagnosticCounts"}
        workItems: {$ref: "#/components/schemas/DiagnosticCounts"}
        operations: {$ref: "#/components/schemas/DiagnosticCounts"}
        inbox: {$ref: "#/components/schemas/DiagnosticCounts"}
        interactions: {$ref: "#/components/schemas/DiagnosticCounts"}
        artifacts: {$ref: "#/components/schemas/DiagnosticCounts"}
        quarantinedRuns: {type: integer, format: int64, minimum: 0}
        oldestQueuedAt: {oneOf: [{$ref: "#/components/schemas/Timestamp"}, {type: "null"}]}
        oldestDrainAt: {oneOf: [{$ref: "#/components/schemas/Timestamp"}, {type: "null"}]}
        correlation: {oneOf: [{$ref: "#/components/schemas/DiagnosticCorrelation"}, {type: "null"}]}
    DiagnosticCorrelation:
      type: object
      additionalProperties: false
      required: [traceId, runs, events, artifacts, operations]
      properties:
        traceId: {type: string, pattern: "^[0-9a-f]{32}$"}
        runs: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/DiagnosticRunIdentity"}}
        events: {type: array, items: {$ref: "#/components/schemas/DiagnosticEventIdentity"}}
        artifacts: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Uuid"}}
        operations: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Uuid"}}
    DiagnosticRunIdentity:
      type: object
      additionalProperties: false
      required: [runId, releaseId, deploymentId, revisionId, cohortId, lifecycle, terminalCode, executorType, createdAt]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        lifecycle: {type: string}
        terminalCode: {$ref: "#/components/schemas/NullableString"}
        executorType: {type: string}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    DiagnosticEventIdentity:
      type: object
      additionalProperties: false
      required: [runId, sequence, eventType, spanId, createdAt]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        sequence: {type: integer, format: int64, minimum: 1}
        eventType: {type: string}
        spanId: {$ref: "#/components/schemas/NullableString"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}

    # Agents
    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
    AgentDefinition:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, description, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        description: {$ref: "#/components/schemas/NullableString"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    AgentDefinitionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentDefinition"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    AgentVersion:
      type: object
      additionalProperties: false
      required: [id, definitionId, workspaceId, sequence, version, apiVersion, digest, createdAt, spec]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        definitionId: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        sequence: {type: integer, format: int64, minimum: 1}
        version: {type: string}
        apiVersion: {type: string}
        digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        spec: {type: object, description: The canonical AgentSpec.}
    AgentVersionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentVersion"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}

    # Capabilities
    ToolType:
      type: string
      enum: [SPRING, JAVA, MCP, HTTP, SHELL, FILESYSTEM, A2A, AGENT]
    ToolIdentity:
      type: object
      additionalProperties: false
      required: [namespace, name, version]
      properties:
        namespace: {type: string, pattern: "^[a-z][a-z0-9.-]{0,63}$"}
        name: {type: string, pattern: "^[a-z][a-z0-9.-]{0,63}$"}
        version: {type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$"}
    CreateToolRequest:
      type: object
      additionalProperties: false
      required: [namespace, name, version, type, summary, description, inputSchema, tags, compatibility,
                 summaryTokens, detailTokens]
      properties:
        namespace: {type: string, pattern: "^[a-z][a-z0-9.-]{0,63}$"}
        name: {type: string, pattern: "^[a-z][a-z0-9.-]{0,63}$"}
        version: {type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$"}
        type: {$ref: "#/components/schemas/ToolType"}
        summary: {type: string, minLength: 1, maxLength: 512}
        description: {type: string, minLength: 1, maxLength: 4096}
        inputSchema: {type: object}
        effect:
          allOf: [{$ref: "#/components/schemas/ToolEffect"}]
          description: Optional for additive v1 compatibility; omission records a fail-safe unclassified CRITICAL effect.
        tags: {type: array, uniqueItems: true, maxItems: 32, items: {type: string, maxLength: 64}}
        compatibility: {type: array, uniqueItems: true, items: {type: string, maxLength: 128}}
        summaryTokens: {type: integer, minimum: 1}
        detailTokens: {type: integer, minimum: 1}
    ToolSummary:
      type: object
      additionalProperties: false
      description: Schema-free discovery metadata; the input schema and description are deliberately absent.
      required: [workspaceId, id, type, summary, schemaHash, effect, tags, compatibility, summaryTokens, detailTokens]
      properties:
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        id: {$ref: "#/components/schemas/ToolIdentity"}
        type: {$ref: "#/components/schemas/ToolType"}
        summary: {type: string}
        schemaHash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        effect: {$ref: "#/components/schemas/ToolEffect"}
        tags: {type: array, uniqueItems: true, items: {type: string}}
        compatibility: {type: array, uniqueItems: true, items: {type: string}}
        summaryTokens: {type: integer, minimum: 1}
        detailTokens: {type: integer, minimum: 1}
    ToolDetail:
      type: object
      additionalProperties: false
      required: [workspaceId, id, type, summary, description, inputSchema, schemaHash, effect, tags, compatibility,
                 summaryTokens, detailTokens, state]
      properties:
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        id: {$ref: "#/components/schemas/ToolIdentity"}
        type: {$ref: "#/components/schemas/ToolType"}
        summary: {type: string}
        description: {type: string}
        inputSchema: {type: object}
        schemaHash: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        effect: {$ref: "#/components/schemas/ToolEffect"}
        tags: {type: array, uniqueItems: true, items: {type: string}}
        compatibility: {type: array, uniqueItems: true, items: {type: string}}
        summaryTokens: {type: integer, minimum: 1}
        detailTokens: {type: integer, minimum: 1}
        state: {type: string, enum: [AVAILABLE, ACTIVE, DISABLED, DENIED]}
    ToolEffect:
      type: object
      additionalProperties: false
      description: Stable authorization facts declared by this exact tool version and pinned into new releases.
      required: [resource, action, risk]
      properties:
        resource: {type: string, minLength: 1, maxLength: 256}
        action: {type: string, minLength: 1, maxLength: 128}
        risk: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    ToolSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ToolSummary"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    McpConnectionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/McpConnection"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    McpConnection:
      type: object
      additionalProperties: false
      required: [connection, version, releaseId, deploymentRevisionId, cohortId, status, code, observedAt, failures]
      properties:
        connection: {type: string, minLength: 1, maxLength: 128}
        version: {type: string, minLength: 1, maxLength: 128}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentRevisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        status: {type: string, enum: [NEW, HEALTHY, DEGRADED, FAILED, CLOSED]}
        code: {type: string, minLength: 1, maxLength: 128}
        observedAt: {type: string, format: date-time}
        failures: {type: integer, format: int64, minimum: 0}
    LifecycleRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [ACTIVE, DISABLED, DENIED]}
    LifecycleResult:
      type: object
      additionalProperties: false
      required: [identity, state]
      properties:
        identity: {type: string}
        state: {type: string, enum: [ACTIVE, DISABLED, DENIED]}
    CreateCapabilityPackRequest:
      type: object
      additionalProperties: false
      required: [id, version, tools]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"}
        version: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"}
        tools: {type: array, uniqueItems: true, items: {$ref: "#/components/schemas/ToolIdentity"}}
    CapabilityPack:
      type: object
      additionalProperties: false
      required: [workspaceId, id, version, state, tools]
      properties:
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        id: {type: string}
        version: {type: string}
        state: {type: string, enum: [AVAILABLE, ACTIVE, DISABLED, DENIED]}
        tools: {type: array, items: {$ref: "#/components/schemas/ToolIdentity"}}

    CreateRememberedPermissionRequest:
      type: object
      additionalProperties: false
      required: [id, effect, scope, actorId, capability, resource, action, environmentId, maximumRisk, expiresAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        effect: {type: string, enum: [ALLOW, DENY]}
        scope: {type: string, enum: [ORGANIZATION, WORKSPACE]}
        actorId: {$ref: "#/components/schemas/Uuid"}
        agentDefinitionId: {$ref: "#/components/schemas/NullableUuid"}
        releaseId: {$ref: "#/components/schemas/NullableUuid"}
        capability: {type: string, minLength: 1, maxLength: 128}
        resource: {type: string, minLength: 1, maxLength: 512}
        action: {type: string, minLength: 1, maxLength: 64}
        environmentId: {$ref: "#/components/schemas/Uuid"}
        maximumRisk: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        validFrom: {$ref: "#/components/schemas/NullableTimestamp"}
        expiresAt: {$ref: "#/components/schemas/Timestamp"}
    RememberedPermission:
      type: object
      additionalProperties: false
      description: Policy identity only; tool arguments, results, and credential material are never stored here.
      required: [id, version, effect, scope, scopeId, actorId, agentDefinitionId, releaseId, capability, resource,
                 action, environmentId, maximumRisk, validFrom, expiresAt, revokedAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        version: {type: integer, format: int64, minimum: 1}
        effect: {type: string, enum: [ALLOW, DENY]}
        scope: {type: string, enum: [ORGANIZATION, WORKSPACE]}
        scopeId: {$ref: "#/components/schemas/Uuid"}
        actorId: {$ref: "#/components/schemas/Uuid"}
        agentDefinitionId: {$ref: "#/components/schemas/NullableUuid"}
        releaseId: {$ref: "#/components/schemas/NullableUuid"}
        capability: {type: string}
        resource: {type: string}
        action: {type: string}
        environmentId: {$ref: "#/components/schemas/Uuid"}
        maximumRisk: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        validFrom: {$ref: "#/components/schemas/Timestamp"}
        expiresAt: {$ref: "#/components/schemas/Timestamp"}
        revokedAt: {$ref: "#/components/schemas/NullableTimestamp"}
    RememberedPermissionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/RememberedPermission"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}

    # Releases and environments
    CreateReleaseRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        evidence: {type: array, items: {$ref: "#/components/schemas/ReleaseEvidenceReference"}}
    ReleaseEvidenceReference:
      type: object
      additionalProperties: false
      required: [kind, identity, digest]
      properties:
        kind: {type: string, enum: [AGENT_TEST, SIMULATION, EVALUATION, CONFIGURATION, SECURITY, BUILD]}
        identity: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:/@+-]{0,255}$"}
        digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    AbomComponent:
      type: object
      additionalProperties: false
      required: [path, identity, digest]
      properties:
        path: {type: string}
        identity: {type: string}
        digest: {type: string}
    Abom:
      type: object
      additionalProperties: false
      required: [version, components, digest]
      properties:
        version: {type: integer}
        components: {type: array, items: {$ref: "#/components/schemas/AbomComponent"}}
        digest: {type: string}
    ReleaseBundlePayload:
      type: object
      additionalProperties: false
      required: [bundleVersion, releaseId, manifest, manifestDigest, evidence, abom]
      properties:
        bundleVersion: {type: integer}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        manifest: {type: string, description: Canonical manifest JSON bytes encoded as a JSON string.}
        manifestDigest: {type: string}
        evidence: {type: array, items: {$ref: "#/components/schemas/ReleaseEvidenceReference"}}
        abom: {$ref: "#/components/schemas/Abom"}
    SignatureEnvelope:
      type: object
      additionalProperties: false
      required: [algorithm, keyId, publicKeyFingerprint, signature, signedAt]
      properties:
        algorithm: {type: string, enum: [Ed25519]}
        keyId: {type: string}
        publicKeyFingerprint: {type: string}
        signature: {type: string}
        signedAt: {$ref: "#/components/schemas/Timestamp"}
    ReleaseBundle:
      type: object
      additionalProperties: false
      required: [payload, signature]
      properties:
        payload: {$ref: "#/components/schemas/ReleaseBundlePayload"}
        signature: {$ref: "#/components/schemas/SignatureEnvelope"}
    PortableBundleRequest:
      type: object
      additionalProperties: false
      required: [bundle]
      properties: {bundle: {type: string, maxLength: 4000000}}
    BundleVerification:
      type: object
      additionalProperties: false
      required: [trusted, code, detail]
      properties:
        trusted: {type: boolean}
        code: {type: string}
        detail: {type: string}
        bundleDigest: {$ref: "#/components/schemas/NullableString"}
    AnchorReceipt:
      type: object
      additionalProperties: false
      required: [provider, bundleDigest, receipt, anchoredAt]
      properties:
        provider: {type: string}
        bundleDigest: {type: string}
        receipt: {type: string}
        anchoredAt: {$ref: "#/components/schemas/Timestamp"}
    Release:
      type: object
      additionalProperties: false
      required: [id, workspaceId, definitionId, versionId, name, manifestDigest, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        definitionId: {$ref: "#/components/schemas/Uuid"}
        versionId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        manifestDigest: {type: string}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    ReleasePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Release"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    ReleaseLifecycle:
      type: object
      additionalProperties: false
      required: [releaseId, state, version, reason, actor, changedAt]
      properties:
        releaseId: {$ref: "#/components/schemas/Uuid"}
        state: {type: string, enum: [PENDING, AVAILABLE, SUSPENDED, REVOKED, RETIRED]}
        version: {type: integer, format: int64, minimum: 1}
        reason: {$ref: "#/components/schemas/NullableString"}
        actor: {$ref: "#/components/schemas/NullableString"}
        changedAt: {$ref: "#/components/schemas/Timestamp"}
    ReleaseLifecycleCommand:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1024}
        subjectKind: {type: string, enum: [RELEASE, SIGNING_KEY, DEPENDENCY]}
        subjectIdentity: {type: string, minLength: 1, maxLength: 512}
        evidenceDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    ReleaseRevocation:
      type: object
      additionalProperties: false
      required: [id, releaseId, subjectKind, subjectIdentity, reason, evidenceDigest, actor, occurredAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        subjectKind: {type: string, enum: [RELEASE, SIGNING_KEY, DEPENDENCY]}
        subjectIdentity: {type: string}
        reason: {type: string}
        evidenceDigest: {$ref: "#/components/schemas/NullableString"}
        actor: {type: string}
        occurredAt: {$ref: "#/components/schemas/Timestamp"}
    ReleaseRevocationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ReleaseRevocation"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    ReleaseLifecycleResult:
      type: object
      additionalProperties: false
      required: [decisionId, lifecycle, revocation, affectedCohortIds]
      properties:
        decisionId: {$ref: "#/components/schemas/Uuid"}
        lifecycle: {$ref: "#/components/schemas/ReleaseLifecycle"}
        revocation:
          oneOf:
            - {$ref: "#/components/schemas/ReleaseRevocation"}
            - {type: "null"}
        affectedCohortIds: {type: array, items: {$ref: "#/components/schemas/Uuid"}}
    SetAliasRequest:
      type: object
      required: [releaseId]
      properties:
        releaseId: {$ref: "#/components/schemas/Uuid"}
    ReleaseAlias:
      type: object
      additionalProperties: false
      required: [name, releaseId, version, updatedAt]
      properties:
        name: {type: string}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        version: {type: integer, format: int64}
        updatedAt: {$ref: "#/components/schemas/Timestamp"}
    PromotionGate:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [REQUIRE_PRIOR_ENVIRONMENT, CHANGE_FREEZE, TEST, EVALUATION, SECURITY, COST, LATENCY, HUMAN_APPROVAL, SEPARATION_OF_DUTIES, RELEASE_EVIDENCE]}
        environment: {$ref: "#/components/schemas/NullableString"}
        evidenceKind: {type: [string, "null"], enum: [TEST, EVALUATION, SECURITY, COST, LATENCY, HUMAN_APPROVAL, RELEASE_EVIDENCE, null]}
        requiredStatus: {$ref: "#/components/schemas/NullableString"}
        metric: {$ref: "#/components/schemas/NullableString"}
        comparison: {type: [string, "null"], enum: [AT_MOST, AT_LEAST, null]}
        threshold: {type: [number, "null"]}
    PromotionPolicy:
      type: object
      additionalProperties: false
      required: [gates]
      properties:
        gates: {type: array, items: {$ref: "#/components/schemas/PromotionGate"}}
        drainDeadline:
          type: [string, "null"]
          description: An ISO-8601 duration after which a draining cohort reports its deadline as exceeded.
        continuityAction: {type: string, enum: [FAIL, DEGRADE]}
        overridesAllowed: {type: boolean}
    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        promotionPolicy: {$ref: "#/components/schemas/PromotionPolicy"}
    Environment:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, description, policyVersion, promotionPolicy, policyDigest, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        description: {$ref: "#/components/schemas/NullableString"}
        policyVersion: {type: integer, format: int64}
        promotionPolicy: {$ref: "#/components/schemas/PromotionPolicy"}
        policyDigest: {type: string}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    EnvironmentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Environment"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}

    # Deployments
    DeploymentConfiguration:
      type: object
      description: Credential references and policy identities only; resolved secret values are never accepted.
      additionalProperties: false
      properties:
        placement: {type: string, enum: [SHARED, ISOLATED, DEDICATED]}
        credentialReferences: {type: object, additionalProperties: {type: string}}
        policyIdentities: {type: array, items: {type: string}}
        placementConstraints: {$ref: "#/components/schemas/PlacementConstraints"}
        exposures:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/ExposureSpec"}
    ExposureSpec:
      type: object
      additionalProperties: false
      required: [id, type, policy]
      properties:
        id: {type: string, pattern: '^[a-z0-9]([a-z0-9._-]*[a-z0-9])?$'}
        type: {type: string, enum: [REST, SSE, A2A, MCP_TOOL, INTERACTION_CHANNEL]}
        channelType: {$ref: "#/components/schemas/NullableString"}
        policy: {$ref: "#/components/schemas/ExposurePolicy"}
        presentation: {type: object, additionalProperties: {type: string}}
    ExposurePolicy:
      type: object
      additionalProperties: false
      required: [authentication, requiredScopes, requestsPerMinute, maxItemBytes, maxEnvelopeBytes,
                 classifications, toolContentAllowed]
      properties:
        authentication: {type: string, maxLength: 128}
        requiredScopes: {type: array, uniqueItems: true, items: {type: string}}
        requestsPerMinute: {type: integer, format: int64, minimum: 1}
        maxItemBytes: {type: integer, format: int64, minimum: 1}
        maxEnvelopeBytes: {type: integer, format: int64, minimum: 1}
        classifications: {type: array, uniqueItems: true, items: {type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]}}
        toolContentAllowed: {type: boolean}
    PlacementConstraints:
      type: object
      additionalProperties: false
      description: Optional exact placement identities; admission fails closed when this installation cannot satisfy one.
      properties:
        securityZone: {type: string, maxLength: 64}
        dataResidency: {type: string, maxLength: 64}
        runtimeClass: {type: string, maxLength: 64}
        imageClass: {type: string, maxLength: 64}
    PromoteRequest:
      type: object
      required: [deployment, releaseId]
      properties:
        deployment: {type: string, description: The deployment name within the environment.}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        configuration: {$ref: "#/components/schemas/DeploymentConfiguration"}
        reason: {type: string}
        evidence: {type: array, items: {$ref: "#/components/schemas/PromotionEvidenceReference"}}
        override: {$ref: "#/components/schemas/OverrideRequest"}
    RollbackRequest:
      type: object
      required: [releaseId]
      properties:
        releaseId: {$ref: "#/components/schemas/Uuid"}
        reason: {type: string}
        evidence: {type: array, items: {$ref: "#/components/schemas/PromotionEvidenceReference"}}
        override: {$ref: "#/components/schemas/OverrideRequest"}
    PromotionEvidenceReference:
      type: object
      additionalProperties: false
      description: Selects immutable evidence from server authority. RELEASE_EVIDENCE uses the release UUID; TEST/EVALUATION/SECURITY/COST/LATENCY use a categorized #53 run UUID whose stored digest is signed by #54 and whose pre-release subject is the immutable spec digest; HUMAN_APPROVAL uses an authenticated Control Plane approval UUID bound to the environment, policy digest, and release. Signed provenance alone is not a verdict.
      required: [id, kind]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        kind: {type: string, enum: [TEST, EVALUATION, SECURITY, COST, LATENCY, HUMAN_APPROVAL, RELEASE_EVIDENCE]}
    PromotionApprovalRequest:
      type: object
      additionalProperties: false
      required: [releaseId]
      properties:
        releaseId: {$ref: "#/components/schemas/Uuid"}
    PromotionApprovalApproveRequest:
      type: object
      additionalProperties: false
      required: [releaseId, policyDigest]
      properties:
        releaseId: {$ref: "#/components/schemas/Uuid"}
        policyDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    PromotionApproval:
      type: object
      additionalProperties: false
      required: [id, workspaceId, environmentId, policyDigest, releaseId, status, requestedBy, approvedBy, createdAt,
                 approvedAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        environmentId: {$ref: "#/components/schemas/Uuid"}
        policyDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        status: {type: string, enum: [REQUESTED, APPROVED]}
        requestedBy: {type: string}
        approvedBy: {$ref: "#/components/schemas/NullableString"}
        createdAt: {type: string, format: date-time}
        approvedAt: {type: [string, "null"], format: date-time}
    OverrideRequest:
      type: [object, "null"]
      additionalProperties: false
      required: [reason, ticket]
      properties:
        reason: {type: string, maxLength: 1024}
        ticket: {type: string, maxLength: 128}
    CommandRequest:
      type: object
      properties:
        reason: {type: string}
    GateResult:
      type: object
      additionalProperties: false
      required: [gate, result, detail]
      properties:
        gate: {$ref: "#/components/schemas/PromotionGate"}
        result: {type: string, enum: [PASSED, FAILED, SKIPPED, OVERRIDDEN]}
        detail: {$ref: "#/components/schemas/NullableString"}
        evidenceId: {$ref: "#/components/schemas/NullableUuid"}
        evidenceDigest: {$ref: "#/components/schemas/NullableString"}
    PromotionResult:
      type: object
      additionalProperties: false
      required: [decisionId, kind, outcome, gates, deploymentId, generation, revisionId, cohortId,
                 routingGenerationId, drainedCohortIds, inputDigest, override, continuity]
      properties:
        decisionId: {$ref: "#/components/schemas/Uuid"}
        kind: {type: string}
        outcome: {type: string}
        gates: {type: array, items: {$ref: "#/components/schemas/GateResult"}}
        deploymentId: {$ref: "#/components/schemas/NullableUuid"}
        generation: {type: [integer, "null"], format: int64}
        revisionId: {$ref: "#/components/schemas/NullableUuid"}
        cohortId: {$ref: "#/components/schemas/NullableUuid"}
        routingGenerationId: {$ref: "#/components/schemas/NullableUuid"}
        drainedCohortIds:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/Uuid"}
        inputDigest: {$ref: "#/components/schemas/NullableString"}
        override: {$ref: "#/components/schemas/OverrideRequest"}
        continuity: {$ref: "#/components/schemas/ContinuityResult"}
    DependencyDrift:
      type: object
      additionalProperties: false
      required: [type, previousDigest, candidateDigest]
      properties:
        type: {type: string, enum: [MODEL, TOOL, MCP, SKILL, POLICY, CHILD, RUNTIME]}
        previousDigest: {type: string}
        candidateDigest: {type: string}
    ContinuityResult:
      type: object
      additionalProperties: false
      required: [state, action, drift]
      properties:
        state: {type: string, enum: [INITIAL, UNCHANGED, FAILED, DEGRADED]}
        action: {type: string, enum: [FAIL, DEGRADE]}
        drift: {type: array, items: {$ref: "#/components/schemas/DependencyDrift"}}
    Deployment:
      type: object
      additionalProperties: false
      required: [id, workspaceId, environmentId, definitionId, name, desiredReleaseId, generation,
                 currentRevisionId, currentRoutingGenerationId, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        environmentId: {$ref: "#/components/schemas/Uuid"}
        definitionId: {$ref: "#/components/schemas/Uuid"}
        name: {type: string}
        desiredReleaseId: {$ref: "#/components/schemas/NullableUuid"}
        generation: {type: integer, format: int64}
        currentRevisionId: {$ref: "#/components/schemas/NullableUuid"}
        currentRoutingGenerationId: {$ref: "#/components/schemas/NullableUuid"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    DeploymentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Deployment"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    Revision:
      type: object
      additionalProperties: false
      required: [id, workspaceId, deploymentId, generation, releaseId, definitionId, environmentId, placement,
                 configurationJson, contentDigest, cause, decisionId, previousRevisionId, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        generation: {type: integer, format: int64}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        definitionId: {$ref: "#/components/schemas/Uuid"}
        environmentId: {$ref: "#/components/schemas/Uuid"}
        placement: {type: string}
        configurationJson: {type: string, description: The canonical DeploymentConfiguration.}
        contentDigest: {type: string}
        cause: {type: string}
        decisionId: {$ref: "#/components/schemas/NullableUuid"}
        previousRevisionId: {$ref: "#/components/schemas/NullableUuid"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    Cohort:
      type: object
      additionalProperties: false
      required: [id, workspaceId, deploymentId, revisionId, state, transitionVersion, stateChangedAt,
                 drainStartedAt, drainDeadline, quiescentSince, retiredAt, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        state: {type: string, enum: [PENDING, ROUTABLE, SUSPENDED, DRAINING, QUIESCENT, RETIRED, REVOKED]}
        transitionVersion: {type: integer, format: int64}
        stateChangedAt: {$ref: "#/components/schemas/Timestamp"}
        drainStartedAt: {$ref: "#/components/schemas/NullableTimestamp"}
        drainDeadline: {$ref: "#/components/schemas/NullableTimestamp"}
        quiescentSince: {$ref: "#/components/schemas/NullableTimestamp"}
        retiredAt: {$ref: "#/components/schemas/NullableTimestamp"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    RoutingGeneration:
      type: object
      additionalProperties: false
      required: [id, workspaceId, deploymentId, generation, policy, decisionId, previousGenerationId, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        generation: {type: integer, format: int64}
        policy: {type: string}
        decisionId: {$ref: "#/components/schemas/NullableUuid"}
        previousGenerationId: {$ref: "#/components/schemas/NullableUuid"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    DeploymentDetail:
      type: object
      additionalProperties: false
      required: [deployment, revisions, cohorts, routingGenerations]
      properties:
        deployment: {$ref: "#/components/schemas/Deployment"}
        revisions: {type: array, items: {$ref: "#/components/schemas/Revision"}}
        cohorts: {type: array, items: {$ref: "#/components/schemas/Cohort"}}
        routingGenerations: {type: array, items: {$ref: "#/components/schemas/RoutingGeneration"}}
    RoutingTarget:
      type: object
      additionalProperties: false
      required: [generationId, ordinal, cohortId, revisionId, weight]
      properties:
        generationId: {$ref: "#/components/schemas/Uuid"}
        ordinal: {type: integer}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        weight: {type: integer}
    RoutingTargetPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/RoutingTarget"}}
        nextCursor: {type: "null"}
    Decision:
      type: object
      additionalProperties: false
      required: [id, workspaceId, kind, outcome, environmentId, definitionId, deploymentId, releaseId, cohortId,
                 policyVersion, policyDigest, gateResultsJson, actor, reason, revisionId, routingGenerationId,
                 createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        kind: {type: string}
        outcome: {type: string}
        environmentId: {$ref: "#/components/schemas/NullableUuid"}
        definitionId: {$ref: "#/components/schemas/NullableUuid"}
        deploymentId: {$ref: "#/components/schemas/NullableUuid"}
        releaseId: {$ref: "#/components/schemas/NullableUuid"}
        cohortId: {$ref: "#/components/schemas/NullableUuid"}
        policyVersion: {type: [integer, "null"], format: int64}
        policyDigest: {$ref: "#/components/schemas/NullableString"}
        gateResultsJson: {$ref: "#/components/schemas/NullableString"}
        actor: {type: string, description: "The authenticated actor, for example `user:<id>/api-token:<id>`."}
        reason: {$ref: "#/components/schemas/NullableString"}
        revisionId: {$ref: "#/components/schemas/NullableUuid"}
        routingGenerationId: {$ref: "#/components/schemas/NullableUuid"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
    CohortResult:
      type: object
      additionalProperties: false
      required: [decisionId, cohortId, state, transitionVersion]
      properties:
        decisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        state: {type: string}
        transitionVersion: {type: integer, format: int64}
    Blocker:
      type: object
      additionalProperties: false
      required: [category, state, count, oldestSince]
      properties:
        category: {type: string}
        state: {type: string}
        count: {type: integer, format: int64}
        oldestSince: {$ref: "#/components/schemas/NullableTimestamp"}
    RetirementResult:
      type: object
      additionalProperties: false
      required: [decisionId, cohortId, outcome, state, transitionVersion, blockers]
      properties:
        decisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        outcome: {type: string, enum: [RETIRED, BLOCKED]}
        state: {type: string}
        transitionVersion: {type: integer, format: int64}
        blockers: {type: array, items: {$ref: "#/components/schemas/Blocker"}}
    QuiescenceReport:
      type: object
      additionalProperties: false
      required: [cohortId, state, transitionVersion, quiescent, blockers, sourceCutoff, drainDeadline,
                 drainDeadlineExceeded]
      properties:
        cohortId: {$ref: "#/components/schemas/Uuid"}
        state: {type: string}
        transitionVersion: {type: integer, format: int64}
        quiescent: {type: boolean}
        blockers: {type: array, items: {$ref: "#/components/schemas/Blocker"}}
        sourceCutoff: {$ref: "#/components/schemas/NullableTimestamp"}
        drainDeadline: {$ref: "#/components/schemas/NullableTimestamp"}
        drainDeadlineExceeded: {type: boolean}
    OutboxQuarantine:
      type: object
      additionalProperties: false
      description: Privacy-safe retry and quarantine evidence; no event or exception payload is retained.
      required: [workspaceId, outboxId, consumer, sequence, eventType, attempts, firstFailedAt, lastFailedAt,
                 quarantinedAt, lastErrorCode, lastErrorDigest, releaseCount, lastReleasedAt]
      properties:
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        outboxId: {$ref: "#/components/schemas/Uuid"}
        consumer: {type: string, pattern: "^[a-z0-9][a-z0-9.-]{0,63}$"}
        sequence: {type: integer, format: int64, minimum: 1}
        eventType: {type: string}
        attempts: {type: integer, minimum: 1}
        firstFailedAt: {$ref: "#/components/schemas/Timestamp"}
        lastFailedAt: {$ref: "#/components/schemas/Timestamp"}
        quarantinedAt: {$ref: "#/components/schemas/Timestamp"}
        lastErrorCode: {type: string}
        lastErrorDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        releaseCount: {type: integer, minimum: 0}
        lastReleasedAt: {$ref: "#/components/schemas/NullableTimestamp"}

    # Sessions, inbox, and durable operations
    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [deploymentId]
      properties:
        deploymentId: {$ref: "#/components/schemas/Uuid"}
    AgentSession:
      type: object
      additionalProperties: false
      required: [id, deploymentId, version, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        updatedAt: {$ref: "#/components/schemas/Timestamp"}
    AgentSessionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentSession"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    InboxMessageType:
      type: string
      enum: [USER_MESSAGE, CHANNEL_MESSAGE, SYSTEM_EVENT, OPERATION_COMPLETED, TEAM_MESSAGE, A2A_MESSAGE, SCHEDULED_WAKEUP]
    InboxMessageStatus:
      type: string
      enum: [PENDING, CLAIMED, CONSUMED, SUPERSEDED, CANCELLED]
    SessionMessageRequest:
      type: object
      additionalProperties: false
      required: [type, correlationId, payload]
      properties:
        runId: {$ref: "#/components/schemas/NullableUuid"}
        type: {$ref: "#/components/schemas/InboxMessageType"}
        correlationId: {type: string, minLength: 1, maxLength: 128}
        payload: {type: object, additionalProperties: true}
    InboxMessage:
      type: object
      additionalProperties: false
      required: [id, sessionId, runId, releaseId, deploymentId, revisionId, cohortId, sequence, type,
                 correlationId, payload, status, version, createdAt, claimUntil, terminalAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        sessionId: {$ref: "#/components/schemas/Uuid"}
        runId: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        sequence: {type: integer, format: int64, minimum: 1}
        type: {$ref: "#/components/schemas/InboxMessageType"}
        correlationId: {type: string}
        payload: {type: object, additionalProperties: true}
        status: {$ref: "#/components/schemas/InboxMessageStatus"}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        claimUntil: {$ref: "#/components/schemas/NullableTimestamp"}
        terminalAt: {$ref: "#/components/schemas/NullableTimestamp"}
    InboxMessagePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/InboxMessage"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    DurableOperationStatus:
      type: string
      enum: [STARTING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    OperationCallbackRequest:
      type: object
      additionalProperties: false
      required: [status, code]
      properties:
        status: {type: string, enum: [SUCCEEDED, FAILED, CANCELLED]}
        code: {type: string, minLength: 1}
        output: {type: object, additionalProperties: true}
    DurableOperation:
      type: object
      additionalProperties: false
      required: [id, sessionId, runId, releaseId, deploymentId, revisionId, cohortId, correlationId, provider,
                 operationType, externalId, status, progressPercent, resultCode, result, createdAt, deadline,
                 updatedAt, resolvedBy, terminalAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        sessionId: {$ref: "#/components/schemas/Uuid"}
        runId: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        correlationId: {type: string}
        provider: {type: string}
        operationType: {type: string}
        externalId: {$ref: "#/components/schemas/NullableString"}
        status: {$ref: "#/components/schemas/DurableOperationStatus"}
        progressPercent: {type: [integer, "null"], minimum: 0, maximum: 100}
        resultCode: {$ref: "#/components/schemas/NullableString"}
        result:
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: "null"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        deadline: {$ref: "#/components/schemas/Timestamp"}
        updatedAt: {$ref: "#/components/schemas/Timestamp"}
        resolvedBy: {$ref: "#/components/schemas/NullableString"}
        terminalAt: {$ref: "#/components/schemas/NullableTimestamp"}
    DurableOperationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/DurableOperation"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}

    # Human interactions
    HumanInteractionKind:
      type: string
      enum: [APPROVAL, QUESTION, SELECTION, FORM, CONFIRMATION, AUTHORIZATION]
    HumanInteractionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {type: string}
        label: {type: string}
    HumanInteractionPrompt:
      type: object
      additionalProperties: false
      required: [title, prompt, consequence, answerSchema, options, minimum, maximum, responseSchema,
                 credentialRef, scopes, policyId]
      properties:
        title: {type: string}
        prompt: {type: string}
        consequence: {$ref: "#/components/schemas/NullableString"}
        answerSchema: {$ref: "#/components/schemas/NullableString"}
        options:
          oneOf:
            - {type: array, items: {$ref: "#/components/schemas/HumanInteractionOption"}}
            - {type: "null"}
        minimum: {type: [integer, "null"]}
        maximum: {type: [integer, "null"]}
        responseSchema: {$ref: "#/components/schemas/NullableString"}
        credentialRef:
          type: [string, "null"]
          description: An opaque reference only; credential material is never returned.
        scopes:
          oneOf:
            - {type: array, uniqueItems: true, items: {type: string}}
            - {type: "null"}
        policyId:
          type: [string, "null"]
          description: Stable delegated-authorization policy identity; never credential material.
    HumanInteractionAssignment:
      type: object
      additionalProperties: false
      required: [level, principalId]
      properties:
        level: {type: string, enum: [WORKSPACE, USER, SESSION, DELEGATED_SUBJECT]}
        principalId: {$ref: "#/components/schemas/NullableUuid"}
    HumanInteractionResponse:
      type: object
      additionalProperties: false
      required: [approved, answerRedacted, optionIds, formRedacted, confirmed, granted]
      properties:
        approved: {type: [boolean, "null"]}
        answerRedacted: {type: [boolean, "null"], description: True instead of returning a question answer.}
        optionIds:
          oneOf:
            - {type: array, items: {type: string}}
            - {type: "null"}
        formRedacted: {type: [boolean, "null"], description: True instead of returning form values.}
        confirmed: {type: [boolean, "null"]}
        granted: {type: [boolean, "null"]}
    HumanInteractionOutcome:
      type: object
      additionalProperties: false
      required: [resolvedBy, resolvedAt, response]
      properties:
        resolvedBy: {type: string}
        resolvedAt: {$ref: "#/components/schemas/Timestamp"}
        response:
          oneOf:
            - {$ref: "#/components/schemas/HumanInteractionResponse"}
            - {type: "null"}
    HumanInteraction:
      type: object
      additionalProperties: false
      required: [id, runId, releaseId, deploymentId, revisionId, cohortId, cohortTransitionVersion,
                 correlationId, kind, prompt, assignment, status, createdAt, deadline, outcome]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        runId: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        cohortTransitionVersion: {type: integer, format: int64, minimum: 1}
        correlationId: {type: string}
        kind: {$ref: "#/components/schemas/HumanInteractionKind"}
        prompt: {$ref: "#/components/schemas/HumanInteractionPrompt"}
        assignment: {$ref: "#/components/schemas/HumanInteractionAssignment"}
        status: {type: string, enum: [OPEN, RESPONDED, EXPIRED, CANCELLED, REVOKED]}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        deadline: {$ref: "#/components/schemas/Timestamp"}
        outcome:
          oneOf:
            - {$ref: "#/components/schemas/HumanInteractionOutcome"}
            - {type: "null"}
    HumanInteractionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/HumanInteraction"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    HumanInteractionResponseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: Exactly one property, matching the interaction kind.
      properties:
        approved: {type: boolean}
        answer: {type: string}
        optionIds: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
        fields: {type: object, additionalProperties: {type: string}}
        confirmed: {type: boolean}
        granted: {type: boolean}

    # Runs
    RunLifecycle:
      type: string
      enum: [CREATED, QUEUED, ACTIVE, BLOCKED, PAUSED, SUCCEEDED, FAILED, CANCELLED]
    SubmitRunRequest:
      type: object
      additionalProperties: false
      properties:
        input:
          description: The run input, recorded in the run's `RUN_CREATED` event; at most 128 KiB canonical JSON.
    Usage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, totalTokens, modelCalls, toolCalls, runtimeMillis, estimatedCostUsd]
      properties:
        inputTokens: {type: integer, format: int64, minimum: 0}
        outputTokens: {type: integer, format: int64, minimum: 0}
        totalTokens: {type: integer, format: int64, minimum: 0}
        modelCalls: {type: integer, format: int64, minimum: 0}
        toolCalls: {type: integer, format: int64, minimum: 0}
        runtimeMillis: {type: integer, format: int64, minimum: 0}
        estimatedCostUsd: {type: number, minimum: 0}
    Run:
      type: object
      additionalProperties: false
      description: |
        A run's immutable pins and its summary, rebuilt from events. `eventSequence` is the monotonic sequence of
        its last event and its ETag.
      required: [id, workspaceId, definitionId, versionId, releaseId, deploymentId, environmentId, revisionId,
                 cohortId, admission, routingGenerationId, routingTargetOrdinal, parentRunId, rootRunId,
                 continuationKind, traceId, manifestVersion, lifecycle, blockReason, terminalCode, eventSequence,
                 checkpointSequence, usage, startedAt, completedAt, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        definitionId: {$ref: "#/components/schemas/NullableUuid"}
        versionId: {$ref: "#/components/schemas/NullableUuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        environmentId: {$ref: "#/components/schemas/NullableUuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        admission: {type: [string, "null"], description: "`ROOT` for an independent root, or a continuation kind."}
        routingGenerationId: {$ref: "#/components/schemas/NullableUuid"}
        routingTargetOrdinal: {type: [integer, "null"]}
        parentRunId: {$ref: "#/components/schemas/NullableUuid"}
        rootRunId: {$ref: "#/components/schemas/NullableUuid"}
        continuationKind: {$ref: "#/components/schemas/NullableString"}
        traceId: {type: [string, "null"], pattern: "^[0-9a-f]{32}$"}
        manifestVersion: {type: [integer, "null"]}
        lifecycle: {$ref: "#/components/schemas/RunLifecycle"}
        blockReason: {$ref: "#/components/schemas/NullableString"}
        terminalCode: {$ref: "#/components/schemas/NullableString"}
        eventSequence: {type: integer, format: int64, minimum: 0}
        checkpointSequence: {type: integer, format: int64, minimum: 0}
        usage: {$ref: "#/components/schemas/Usage"}
        startedAt: {$ref: "#/components/schemas/NullableTimestamp"}
        completedAt: {$ref: "#/components/schemas/NullableTimestamp"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        inDoubtEffects:
          type: array
          items: {type: string}
          description: |
            Present only in a pause answer (#183) for an active run with effects in doubt: their keys. An effect is
            listed from the moment its intent is recorded until its outcome is, so the list includes an effect the
            worker is still invoking as well as one whose invocation failed with an unknown outcome; the two cannot be
            told apart until the worker records the outcome. A pending pause takes effect only once no effect is
            listed.
    RunPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Run"}}
        nextCursor: {$ref: "#/components/schemas/NullableString"}
    ReplayMode:
      type: string
      enum: [EXACT, MODEL_REPLAY]
    ReplayDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    ReplaySubstitution:
      type: object
      additionalProperties: false
      required: [kind, key, status, resultDigest]
      properties:
        kind: {type: string, enum: [TOOL, HUMAN, OPERATION]}
        key: {type: string}
        status: {type: string, enum: [RECORDED, UNAVAILABLE]}
        resultDigest: {$ref: "#/components/schemas/NullableString"}
    ReplayProvenance:
      type: object
      additionalProperties: false
      required: [sourceRunId, sourceReleaseId, sourceDeploymentId, sourceRevisionId, sourceCohortId,
                 sourceEventDigest, sourceEventSequence]
      properties:
        sourceRunId: {$ref: "#/components/schemas/Uuid"}
        sourceReleaseId: {$ref: "#/components/schemas/Uuid"}
        sourceDeploymentId: {$ref: "#/components/schemas/Uuid"}
        sourceRevisionId: {$ref: "#/components/schemas/Uuid"}
        sourceCohortId: {$ref: "#/components/schemas/Uuid"}
        sourceEventDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        sourceEventSequence: {type: integer, format: int64, minimum: 1}
    ReplayPlan:
      type: object
      additionalProperties: false
      required: [replayId, mode, provenance, compatibility, effectPolicy, liveEffectsAllowed, substitutions,
                 diagnostics, executable, plannedAt]
      properties:
        replayId: {$ref: "#/components/schemas/Uuid"}
        mode: {$ref: "#/components/schemas/ReplayMode"}
        provenance: {$ref: "#/components/schemas/ReplayProvenance"}
        compatibility: {type: string}
        effectPolicy: {type: string, const: RECORDED_RESULTS_ONLY}
        liveEffectsAllowed: {type: boolean, const: false}
        substitutions: {type: array, items: {$ref: "#/components/schemas/ReplaySubstitution"}}
        diagnostics: {type: array, items: {$ref: "#/components/schemas/ReplayDiagnostic"}}
        executable: {type: boolean}
        plannedAt: {$ref: "#/components/schemas/Timestamp"}
    ReplayResult:
      type: object
      additionalProperties: false
      required: [plan, output]
      properties:
        plan: {$ref: "#/components/schemas/ReplayPlan"}
        output: {}
    RunEvent:
      type: object
      additionalProperties: false
      description: |
        The typed run event envelope, identical in event pages and in the SSE `data` field. `schemaVersion` is the
        payload version as recorded, and `servedSchemaVersion` is the version of the served `payload` (older recorded
        payloads are lifted by upcasters). Prompts and tool arguments are recorded only as digests, and no credential is ever
        recorded.
      required: [envelopeVersion, runId, workspaceId, releaseId, deploymentId, revisionId, cohortId, sequence,
                 type, category, schemaVersion, servedSchemaVersion, traceId, spanId, actor, leaseFence,
                 eventDigest, createdAt, payload]
      properties:
        envelopeVersion: {type: integer, const: 1}
        runId: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        sequence: {type: integer, format: int64, minimum: 1}
        type: {type: string, description: "A run event type such as `RUN_CREATED` or `MODEL_STREAM_CHUNK`."}
        category: {type: string, enum: [MODEL, TOOL, HUMAN, OPERATION, SUB_AGENT, CONTEXT, MEMORY, ARTIFACT, RELEASE, SYSTEM]}
        schemaVersion: {type: integer, minimum: 1, description: The payload version as recorded.}
        servedSchemaVersion: {type: integer, minimum: 1, description: The version of the served payload after upcasting.}
        traceId: {type: [string, "null"], pattern: "^[0-9a-f]{32}$"}
        spanId: {type: [string, "null"], pattern: "^[0-9a-f]{16}$"}
        actor: {type: string}
        leaseFence: {type: integer, format: int64, minimum: 0}
        eventDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
        createdAt: {$ref: "#/components/schemas/Timestamp"}
        payload: {type: object}
    RunEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/RunEvent"}}
        nextCursor: {type: [string, "null"], pattern: "^(0|[1-9][0-9]{0,18})$"}
    ContextDebug:
      type: object
      additionalProperties: false
      required: [runId, workspaceId, releaseId, deploymentId, revisionId, cohortId, events]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        workspaceId: {$ref: "#/components/schemas/Uuid"}
        releaseId: {$ref: "#/components/schemas/Uuid"}
        deploymentId: {$ref: "#/components/schemas/Uuid"}
        revisionId: {$ref: "#/components/schemas/Uuid"}
        cohortId: {$ref: "#/components/schemas/Uuid"}
        events:
          type: array
          maxItems: 5000
          items: {$ref: "#/components/schemas/RunEvent"}
    AgentStep:
      type: object
      additionalProperties: false
      required: [stepId, category, name, status, firstSequence, lastSequence, eventTypes, startedAt, endedAt]
      properties:
        stepId: {type: string}
        category: {type: string}
        name: {$ref: "#/components/schemas/NullableString"}
        status: {type: string, enum: [STARTED, COMPLETED, FAILED, RECORDED]}
        firstSequence: {type: integer, format: int64}
        lastSequence: {type: integer, format: int64}
        eventTypes: {type: array, items: {type: string}}
        startedAt: {$ref: "#/components/schemas/NullableTimestamp"}
        endedAt: {$ref: "#/components/schemas/NullableTimestamp"}
    AgentStepPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentStep"}}
        nextCursor: {type: "null"}
    StreamEnd:
      type: object
      additionalProperties: false
      required: [runId, lastSequence, lifecycle, terminalCode]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        lastSequence: {type: integer, format: int64}
        lifecycle: {$ref: "#/components/schemas/RunLifecycle"}
        terminalCode: {$ref: "#/components/schemas/NullableString"}
    StreamReconnect:
      type: object
      additionalProperties: false
      required: [runId, lastSequence, reason]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        lastSequence: {type: integer, format: int64}
        reason: {type: string, enum: [MAX_DURATION, SHUTDOWN, STREAM_LIMIT_EXCEEDED, STREAM_BUSY]}
    StreamError:
      type: object
      additionalProperties: false
      required: [runId, lastSequence, code]
      properties:
        runId: {$ref: "#/components/schemas/Uuid"}
        lastSequence: {type: integer, format: int64}
        code: {type: string}
