      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SessionMessageRequest"}}}
      responses:
        "200": {description: The previously delivered message., content: {application/json: {schema: {$ref: "#/components/schemas/InboxMessage"}}}}
        "201": {description: The newly delivered message., content: {application/json: {schema: {$ref: "#/components/schemas/InboxMessage"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      operationId: listSessionMessages
      tags: [Sessions]
      summary: Lists a session's durable inbox in descending session sequence.
      x-agentworks-authorization: {need: PERMISSION, permission: WORKSPACE_READ}
