{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentworks.fullname" . }}
  labels:
    {{- include "agentworks.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentworks.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        {{- range .Values.networkPolicy.egressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: {{ .Values.networkPolicy.httpsPort }}, protocol: TCP}
        - {port: {{ .Values.networkPolicy.databasePort }}, protocol: TCP}
{{- end }}
