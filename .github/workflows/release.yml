name: Protected OSS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'dvarahq/dvara-agentworks'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify supply-chain policy before using a release tool
        run: python3 scripts/ci/verify_supply_chain.py
      - name: Build the isolated release candidate
        run: scripts/release/build-release-candidate.sh release "${{ inputs.tag }}" target/oss-release-candidate
      - name: Expose the OCI layout to the vulnerability scanner
        run: |
          mkdir -p target/trivy-oci
          tar -xf target/oss-release-candidate/artifacts/oci/agentworks.oci.tar -C target/trivy-oci
      - name: Block exploitable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: target/trivy-oci
          format: json
          output: target/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
      - name: Enforce reviewed, expiring vulnerability exceptions
        run: python3 scripts/ci/verify_supply_chain.py --vulnerability-report target/trivy-image.json
      - name: Preserve the credential-free candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oss-release-candidate
          path: target/oss-release-candidate/
          if-no-files-found: error
          retention-days: 7

  approve-and-publish:
    needs: build
    if: github.repository == 'dvarahq/dvara-agentworks' && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oss-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oss-release-candidate
          path: target/oss-release-candidate
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the complete checksum manifest with ephemeral OIDC identity
        run: >-
          cosign sign-blob --yes
          --bundle target/oss-release-candidate/SHA256SUMS.sigstore.json
          target/oss-release-candidate/SHA256SUMS
      - name: Verify the release signature and every artifact from the downloaded candidate
        run: >-
          python3 scripts/release/verify_release_candidate.py target/oss-release-candidate
          --phase release --expected-commit "$(git rev-parse HEAD)"
      - name: Generate GitHub artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/oss-release-candidate/artifacts/**
      - name: Build deterministic release archive
        run: >-
          tar --sort=name --mtime="@$(git show -s --format=%ct)" --owner=0 --group=0 --numeric-owner
          -C target -czf "agentworks-${{ inputs.tag }}.tar.gz" oss-release-candidate
      - name: Publish only after protected-environment approval
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            target/agentworks-${{ inputs.tag }}.tar.gz
            target/oss-release-candidate/SHA256SUMS
            target/oss-release-candidate/SHA256SUMS.sigstore.json
